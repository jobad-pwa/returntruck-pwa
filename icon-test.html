<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Test</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body {
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 { color: #2563eb; font-size: 24px; margin-bottom: 20px; }
        .icon-preview {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .icon-box {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            width: 120px;
            text-align: center;
        }
        .icon-box img {
            width: 64px;
            height: 64px;
            border-radius: 12px;
        }
        .icon-box .label {
            font-size: 11px;
            color: #64748b;
            margin-top: 8px;
        }
        .status {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px;
            margin: 16px 0;
            text-align: left;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
            border-bottom: 1px solid #f1f5f9;
        }
        .status-item:last-child { border-bottom: none; }
        .pass { color: #16a34a; font-weight: 600; }
        .fail { color: #dc2626; font-weight: 600; }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            background: #2563eb;
            color: white;
            margin: 6px 0;
        }
        .btn:hover { opacity: 0.8; }
        .btn-success { background: #16a34a; }
        .btn-danger { background: #dc2626; }
        .log-box {
            background: #0f172a;
            color: #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 11px;
            max-height: 100px;
            overflow-y: auto;
            text-align: left;
            margin-top: 12px;
            white-space: pre-wrap;
        }
        .log-box .success { color: #4ade80; }
        .log-box .error { color: #f87171; }
        .log-box .info { color: #60a5fa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚛 Icon Test</h1>
        <p style="color:#64748b;margin-bottom:16px;">Testing if Chrome can load icons from manifest</p>

        <div class="icon-preview" id="icon-preview">
            <div class="icon-box">
                <img id="icon-192" src="" alt="192x192">
                <div class="label">192x192</div>
            </div>
            <div class="icon-box">
                <img id="icon-512" src="" alt="512x512">
                <div class="label">512x512</div>
            </div>
        </div>

        <div class="status">
            <div class="status-item">
                <span>📄 Manifest</span>
                <span id="manifest-status" class="pending">Checking...</span>
            </div>
            <div class="status-item">
                <span>🖼️ Icon 192x192</span>
                <span id="icon-192-status" class="pending">Checking...</span>
            </div>
            <div class="status-item">
                <span>🖼️ Icon 512x512</span>
                <span id="icon-512-status" class="pending">Checking...</span>
            </div>
            <div class="status-item">
                <span>📱 Install Ready</span>
                <span id="install-status" class="pending">Waiting...</span>
            </div>
        </div>

        <button class="btn" onclick="testInstall()">📲 Test Install</button>
        <button class="btn btn-success" onclick="refreshTest()">🔄 Refresh Test</button>
        <button class="btn btn-danger" onclick="clearCache()">🗑️ Clear Cache</button>

        <div class="log-box" id="log-box">
            ⏳ Initializing...
        </div>
    </div>

    <script>
        let deferredPrompt = null;

        function addLog(msg, type = 'info') {
            const log = document.getElementById('log-box');
            const time = new Date().toLocaleTimeString();
            const colors = { success: 'success', error: 'error', info: 'info', warn: 'warn' };
            log.innerHTML += `[${time}] <span class="${colors[type] || 'info'}">${msg}</span>\n`;
            log.scrollTop = log.scrollHeight;
            console.log(msg);
        }

        function updateStatus(id, status, msg) {
            const el = document.getElementById(id);
            if (!el) return;
            const icons = { pass: '✅', fail: '❌', pending: '⏳', info: 'ℹ️' };
            el.className = status;
            el.textContent = `${icons[status] || 'ℹ️'} ${msg || status}`;
        }

        async function testManifest() {
            try {
                const r = await fetch('/manifest.json');
                if (!r.ok) {
                    updateStatus('manifest-status', 'fail', 'Not found');
                    addLog('❌ Manifest 404!', 'error');
                    return false;
                }
                const data = await r.json();
                updateStatus('manifest-status', 'pass', 'Loaded');
                addLog('✅ Manifest loaded', 'success');
                addLog(`   Name: ${data.name}`, 'info');
                addLog(`   Icons: ${data.icons ? data.icons.length : 0}`, 'info');

                // Test icons
                if (data.icons && data.icons.length > 0) {
                    // Check 192x192
                    const icon192 = data.icons.find(i => i.sizes === '192x192' || i.sizes === '192x192');
                    if (icon192) {
                        const img = document.getElementById('icon-192');
                        img.src = icon192.src;
                        img.onload = () => {
                            updateStatus('icon-192-status', 'pass', 'Loaded!');
                            addLog('✅ 192x192 icon loaded', 'success');
                        };
                        img.onerror = () => {
                            updateStatus('icon-192-status', 'fail', 'Failed to load');
                            addLog('❌ 192x192 icon failed to load', 'error');
                        };
                    } else {
                        updateStatus('icon-192-status', 'fail', 'Not in manifest');
                    }

                    // Check 512x512
                    const icon512 = data.icons.find(i => i.sizes === '512x512' || i.sizes === '512x512');
                    if (icon512) {
                        const img = document.getElementById('icon-512');
                        img.src = icon512.src;
                        img.onload = () => {
                            updateStatus('icon-512-status', 'pass', 'Loaded!');
                            addLog('✅ 512x512 icon loaded', 'success');
                        };
                        img.onerror = () => {
                            updateStatus('icon-512-status', 'fail', 'Failed to load');
                            addLog('❌ 512x512 icon failed to load', 'error');
                        };
                    } else {
                        updateStatus('icon-512-status', 'fail', 'Not in manifest');
                    }
                }
                return true;
            } catch (e) {
                updateStatus('manifest-status', 'fail', 'Error');
                addLog(`❌ Manifest error: ${e.message}`, 'error');
                return false;
            }
        }

        function testInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(choice => {
                    if (choice.outcome === 'accepted') {
                        addLog('🎉 User installed!', 'success');
                        updateStatus('install-status', 'pass', 'Installed!');
                    } else {
                        addLog('❌ User dismissed', 'warn');
                    }
                    deferredPrompt = null;
                });
            } else {
                addLog('⚠️ No install prompt available', 'warn');
                if (navigator.userAgent.match(/Android/i)) {
                    addLog('📱 Tap Chrome menu ⋮ → "Install app"', 'info');
                } else {
                    addLog('📱 Try "Add to Home Screen" manually', 'info');
                }
            }
        }

        function refreshTest() {
            addLog('🔄 Refreshing...', 'info');
            document.getElementById('log-box').innerHTML = '';
            testManifest();
        }

        function clearCache() {
            if (confirm('Clear all cached data?')) {
                if ('caches' in window) {
                    caches.keys().then(keys => {
                        keys.forEach(k => caches.delete(k));
                    });
                }
                localStorage.clear();
                addLog('🗑️ Cache cleared! Reloading...', 'warn');
                setTimeout(() => window.location.reload(), 1000);
            }
        }

        // Event listeners
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            updateStatus('install-status', 'pass', 'Ready to install!');
            addLog('✅ Install prompt received!', 'success');
        });

        window.addEventListener('appinstalled', () => {
            addLog('🎉 App installed successfully!', 'success');
            updateStatus('install-status', 'pass', 'Installed!');
        });

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            addLog('🚀 Icon test initialized', 'info');
            addLog(`📍 ${window.location.href}`, 'info');
            setTimeout(testManifest, 500);
        });
    </script>
</body>
</html>
