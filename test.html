<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        *{box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
        body{background:#f3f4f6;padding:20px;margin:0}
        .container{max-width:800px;margin:0 auto;background:#fff;border-radius:24px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.1)}

        h2{font-size:16px;color:#1e293b;margin:20px 0 10px;padding-bottom:8px;border-bottom:2px solid #e2e8f0}

        .test-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
        .test-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:16px}
        .test-card label{font-size:11px;font-weight:700;color:#1e293b;display:block;margin-bottom:4px}
        .test-card input{width:100%;padding:10px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;background:#fff;margin-bottom:8px}
        .test-card input:focus{border-color:#2563eb;outline:none}
        .btn{width:100%;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;margin-bottom:4px}
        .btn-primary{background:#2563eb;color:#fff}
        .btn-primary:hover{background:#1d4ed8}
        .btn-success{background:#16a34a;color:#fff}
        .btn-success:hover{background:#15803d}
        .btn-danger{background:#dc2626;color:#fff}
        .btn-danger:hover{background:#b91c1c}
        .btn-warning{background:#f59e0b;color:#000}
        .btn-warning:hover{background:#d97706}
        .btn-gray{background:#6b7280;color:#fff}
        .btn-gray:hover{background:#4b5563}
        .result-box{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:12px;font-family:monospace;font-size:11px;max-height:300px;overflow-y:auto;margin-top:8px;white-space:pre-wrap;word-break:break-all}
        .result-box .pass{color:#4ade80}
        .result-box .fail{color:#f87171}
        .result-box .info{color:#60a5fa}
        .result-box .warn{color:#fbbf24}
        .result-box .highlight{color:#f472b6;font-weight:bold}
        .step{background:#f1f5f9;border-radius:8px;padding:10px;margin:4px 0;border-left:4px solid #94a3b8}
        .step.pass{border-left-color:#16a34a;background:#f0fdf4}
        .step.fail{border-left-color:#dc2626;background:#fef2f2}
        .step .title{font-weight:700;font-size:12px;color:#1e293b}
        .step .detail{font-size:11px;color:#475569;font-family:monospace;margin-top:2px}
        .flex{display:flex;gap:8px;flex-wrap:wrap}
        .flex .btn{flex:1;min-width:100px}
        .dt-info{background:#dbeafe;border-radius:8px;padding:12px;margin:8px 0;font-size:12px}
        .dt-info strong{color:#1e40af}
        .status-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:10px;font-weight:700}
        .status-badge.success{background:#dcfce7;color:#166534}
        .status-badge.error{background:#fef2f2;color:#991b1b}
        .status-badge.pending{background:#fef3c7;color:#92400e}
        .clear-btn{padding:6px 16px;background:#ef4444;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px}
        .clear-btn:hover{background:#dc2626}
        .header-right{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
        .mobile-display{font-size:20px;font-weight:700;color:#1e293b;text-align:center;padding:8px;background:#f1f5f9;border-radius:8px;margin:8px 0}
    </style>
</head>
<body>
<div class="container">

<script>

// CONFIG

var SB_URL = 'https://ghjoffovatgvhzxlupef.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdoam9mZm92YXRndmh6eGx1cGVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MDM4MjQsImV4cCI6MjEwMDk3OTgyNH0.bGDIHZDcLdZqJl9u5qhDm5mlGfWR3fp1sxrpwCtsDsg';

// ============================================================
// LOGGING
// ============================================================
function log(msg, type) {
    var el = document.getElementById('result-log');
    var time = new Date().toLocaleTimeString();
    var colors = { pass: 'pass', fail: 'fail', info: 'info', warn: 'warn', highlight: 'highlight' };
    el.innerHTML += '[' + time + '] <span class="' + (colors[type] || 'info') + '">' + msg + '</span>\n';
    el.scrollTop = el.scrollHeight;
}

function clearLog() {
    document.getElementById('result-log').innerHTML = '';
    document.getElementById('steps-container').innerHTML = '';
    log('🗑️ Log cleared', 'info');
    ['login-status', 'reg-status', 'change-status', 'reset-status'].forEach(function(id) {
        document.getElementById(id).textContent = 'Ready';
        document.getElementById(id).style.color = '#64748b';
    });
}

function addStep(title, detail, status, data) {
    var container = document.getElementById('steps-container');
    var cls = 'step';
    if (status === 'pass') cls += ' pass';
    else if (status === 'fail') cls += ' fail';
    
    var html = '<div class="' + cls + '">';
    html += '<div class="title">' + title + '</div>';
    html += '<div class="detail">' + detail + '</div>';
    if (data) {
        html += '<div class="detail" style="color:#2563eb;margin-top:4px">📦 ' + JSON.stringify(data, null, 2) + '</div>';
    }
    html += '</div>';
    container.innerHTML += html;
    container.scrollTop = container.scrollHeight;
}

function setStatus(id, text, color) {
    var el = document.getElementById(id);
    if (el) {
        el.textContent = text;
        el.style.color = color || '#64748b';
    }
}

function getMobile() {
    return document.getElementById('test-mobile').value.trim();

// ============================================================
// TEST: Check User (Edge Function)
// ============================================================
async function testCheckUser() {
    var mobile = getMobile();
    if (!mobile || mobile.length !== 10) {
        log('❌ Enter valid 10-digit mobile', 'fail');
        return;
    }

    log('📡 Testing Edge Function check for: ' + mobile, 'info');
    setStatus('login-status', '⏳ Checking...', '#f59e0b');

    try {
        // Convert mobile to BIGINT
        var mobileNum = parseInt(mobile);
        log('📊 Mobile as BIGINT: ' + mobileNum + ' (type: ' + typeof mobileNum + ')', 'info');

        var response = await fetch(EDGE_URL + '/login-user', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Authorization': 'Bearer ' + SB_KEY
            },
            body: JSON.stringify({
                mobile: mobile,
                action: 'check'
            })
        });

        var result = await response.json();
        
        addStep(
            '📡 Edge Function: Check User',
            'Status: ' + response.status + '\nResponse: ' + JSON.stringify(result, null, 2),
            result.exists === true ? 'pass' : 'fail',
            result
        );

        if (result.exists === true) {
            log('✅ User FOUND: ' + JSON.stringify(result.user), 'pass');
            setStatus('login-status', '✅ Found', '#16a34a');
        } else {
            log('❌ User NOT FOUND', 'fail');
            setStatus('login-status', '❌ Not found', '#dc2626');
        }

        return result;
    } catch (e) {
        log('❌ Error: ' + e.message, 'fail');
        setStatus('login-status', '❌ Error', '#dc2626');
        addStep('❌ Check User Error', e.message, 'fail');
        return null;
    }
}

// ============================================================
// TEST: Login
// ============================================================
async function testLogin() {
    var mobile = getMobile();
    var pin = document.getElementById('login-pin').value.trim();

    if (!mobile || mobile.length !== 10) {
        log('❌ Enter valid 10-digit mobile', 'fail');
        return;
    }
    if (!pin || pin.length !== 4) {
        log('❌ Enter 4-digit PIN', 'fail');
        return;
    }

    log('🔐 Testing Login for: ' + mobile, 'info');
    setStatus('login-status', '⏳ Logging in...', '#f59e0b');

    try {
        var mobileNum = parseInt(mobile);
        log('📊 Mobile as BIGINT: ' + mobileNum + ' (type: ' + typeof mobileNum + ')', 'info');
        log('📊 PIN: ' + pin + ' (type: ' + typeof pin + ')', 'info');

        // Hash PIN for comparison
        var enc = new TextEncoder();
        var hash = await crypto.subtle.digest('SHA-256', enc.encode(pin));
        var ph = Array.from(new Uint8Array(hash)).map(function(b) {
            return b.toString(16).padStart(2, '0');
        }).join('');
        log('📊 PIN Hash: ' + ph.substring(0, 20) + '...', 'info');

        var response = await fetch(EDGE_URL + '/login-user', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Authorization': 'Bearer ' + SB_KEY
            },
            body: JSON.stringify({
                mobile: mobile,
                action: 'login',
                pin: pin
            })
        });

        var result = await response.json();

        addStep(
            '🔐 Login Attempt',
            'Status: ' + response.status + '\nResponse: ' + JSON.stringify(result, null, 2),
            result.success === true ? 'pass' : 'fail',
            result
        );

        if (result.success === true && result.user) {
            log('✅ Login SUCCESS! User: ' + result.user.mobile, 'pass');
            setStatus('login-status', '✅ Success', '#16a34a');
            return result;
        } else if (result.isNewUser === true) {
            log('ℹ️ New user - needs registration', 'warn');
            setStatus('login-status', 'ℹ️ New user', '#f59e0b');
            return result;
        } else if (result.source === 'archived') {
            log('ℹ️ Archived account found', 'warn');
            setStatus('login-status', 'ℹ️ Archived', '#f59e0b');
            return result;
        } else {
            log('❌ Login FAILED: ' + (result.error || 'Unknown error'), 'fail');
            setStatus('login-status', '❌ Failed', '#dc2626');
            return result;
        }
    } catch (e) {
        log('❌ Login error: ' + e.message, 'fail');
        setStatus('login-status', '❌ Error', '#dc2626');
        addStep('❌ Login Error', e.message, 'fail');
        return null;
    }
}

        log('📊 Mobile as BIGINT: ' + mobileNum + ' (type: ' + typeof mobileNum + ')', 'info');
        log('📊 PIN: ' + pin + ' (type: ' + typeof pin + ')', 'info');

        var response = await fetch(EDGE_URL + '/register-user', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Authorization': 'Bearer ' + SB_KEY
            },

                mobile: mobile,

        addStep(
            '📝 Registration Attempt',
            'Status: ' + response.status + '\nResponse: ' + JSON.stringify(result, null, 2),
            result.success === true ? 'pass' : 'fail',
            result
        );

        if (result.success === true && result.user) {
            log('✅ Registration SUCCESS! User: ' + result.user.mobile, 'pass');
            setStatus('reg-status', '✅ Success', '#16a34a');

        } else if (result.code === 'USER_EXISTS_ACTIVE') {

        addStep('❌ Registration Error', e.message, 'fail');
        return null;

// ============================================================
// TEST: Direct SQL
// ============================================================
async function testDirectSQL() {
    var mobile = getMobile();
    if (!mobile || mobile.length !== 10) {
        log('❌ Enter valid 10-digit mobile', 'fail');
        return;
    }

    var mobileNum = parseInt(mobile);
    log('🗄️ Testing Direct SQL for: ' + mobile + ' (BIGINT: ' + mobileNum + ')', 'info');

    try {
        // Check active_users
        var { data: active, error: activeErr } = await sb
            .from('active_users')
            .select('*')
            .eq('mobile', mobileNum)
            .maybeSingle();

        if (active) {
            log('✅ Found in active_users: ' + active.mobile + ' (type: ' + typeof active.mobile + ')', 'pass');
            addStep(
                '🗄️ Active Users Query',
                'Mobile: ' + active.mobile + ' (type: ' + typeof active.mobile + ')\n' +
                'PIN Hash: ' + (active.pinhash ? active.pinhash.substring(0, 20) + '...' : 'Not set') + '\n' +
                'Name: ' + (active.name || 'Not set'),
                'pass',
                active
            );
            return active;
        }

        // Check archived_users
        var { data: archived, error: archErr } = await sb
            .from('archived_users')
            .select('*')
            .eq('mobile', mobileNum)
            .maybeSingle();

        if (archived) {
            log('✅ Found in archived_users: ' + archived.mobile, 'pass');
            addStep(
                '🗄️ Archived Users Query',
                'Mobile: ' + archived.mobile + '\n' +
                'User Data: ' + JSON.stringify(archived.user_data, null, 2),
                'pass',
                archived
            );
            return archived;
        }

        log('❌ User NOT FOUND in any table', 'fail');
        addStep('🗄️ Direct SQL Query', 'User NOT FOUND in active_users or archived_users', 'fail');
        return null;
    } catch (e) {
        log('❌ Direct SQL error: ' + e.message, 'fail');
        return null;
    }
}

// ============================================================
// TEST: Full Flow
// ============================================================
async function testFullFlow() {
    log('🚀 Starting full flow test...', 'info');
    document.getElementById('steps-container').innerHTML = '';
    
    // Step 1: Check user
    log('📡 Step 1: Checking user existence', 'info');
    var checkResult = await testCheckUser();
    
    if (checkResult && checkResult.exists === true) {
        log('✅ User exists. Testing login...', 'pass');
        // Step 2: Try login
        var loginResult = await testLogin();
        
        if (loginResult && loginResult.success === true) {
            log('✅ Login successful. Testing PIN change...', 'pass');
            // Step 3: Test change PIN
            document.getElementById('change-current').value = document.getElementById('login-pin').value;
            document.getElementById('change-new').value = '4321';
            document.getElementById('change-confirm').value = '4321';
            await testChangePin();
            
            log('🔄 Testing PIN reset...', 'info');
            document.getElementById('reset-new').value = '1234';
            document.getElementById('reset-confirm').value = '1234';
            await testResetPin();
        } else if (loginResult && loginResult.isNewUser === true) {
            log('ℹ️ New user. Testing registration...', 'warn');
            document.getElementById('reg-pin').value = document.getElementById('login-pin').value;
            document.getElementById('reg-pin-confirm').value = document.getElementById('login-pin').value;
            await testRegister();
        }
    } else {
        log('ℹ️ New user. Testing registration...', 'warn');
        document.getElementById('reg-pin').value = '1234';
        document.getElementById('reg-pin-confirm').value = '1234';
        await testRegister();
        
        log('🔐 Testing login after registration...', 'info');
        document.getElementById('login-pin').value = '1234';
        await testLogin();
    }
    
    log('✅ Full flow test completed!', 'pass');
    addStep('✅ Test Complete', 'All tests executed. Check results above.', 'pass');
}
