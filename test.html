// ============================================================
// LOGGING
// ============================================================
function log(msg, type) {
    var el = document.getElementById('result-log');
    var time = new Date().toLocaleTimeString();
    var colors = { pass: 'pass', fail: 'fail', info: 'info', warn: 'warn', highlight: 'highlight' };
    el.innerHTML += '[' + time + '] <span class="' + (colors[type] || 'info') + '">' + msg + '</span>\n';
    el.scrollTop = el.scrollHeight;
}

function clearAll() {
    document.getElementById('result-log').innerHTML = '';
    document.getElementById('steps-container').innerHTML = '';
    document.getElementById('raw-response').style.display = 'none';
    document.getElementById('raw-response').innerHTML = '';
    document.getElementById('status-box').style.display = 'none';
    log('🗑️ Cleared', 'info');
    testResults = [];
}

function addStep(title, detail, status, data) {
    var container = document.getElementById('steps-container');
    var cls = 'step';
    if (status === 'pass') cls += ' pass';
    else if (status === 'fail') cls += ' fail';
    
    var html = '<div class="' + cls + '">';
    html += '<div class="title">' + title + '</div>';
    html += '<div class="detail">' + detail + '</div>';
    if (data) {
        html += '<div class="detail" style="color:#60a5fa;margin-top:4px">📦 ' + JSON.stringify(data, null, 2) + '</div>';
    }
    html += '</div>';
    container.innerHTML += html;
    container.scrollTop = container.scrollHeight;
}

function setStatus(text, type) {
    var el = document.getElementById('status-box');
    el.style.display = 'block';
    el.textContent = text;
    el.className = 'status-text ' + (type || 'pending');
}

function showRawResponse(data) {
    var el = document.getElementById('raw-response');
    el.style.display = 'block';
    el.innerHTML = JSON.stringify(data, null, 2);
}

// ============================================================
// HASH HELPER
// ============================================================
async function hashPIN(pinValue) {
    var enc = new TextEncoder();
    var hash = await crypto.subtle.digest('SHA-256', enc.encode(pinValue));
    var hashArray = Array.from(new Uint8Array(hash));
    return hashArray.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
}

        var response = await fetch(EDGE_URL + '/login-user', {

        log('📥 Response: ' + JSON.stringify(result, null, 2), 'info');

    setStatus('Logging in...', 'pending');

    try {
        var mobileNum = parseInt(m);
        var pinHash = await hashPIN(p);
        
        log('📊 Mobile as BIGINT: ' + mobileNum + ' (type: ' + typeof mobileNum + ')', 'info');
        log('📊 PIN: "' + p + '" (type: ' + typeof p + ')', 'info');
        log('📊 PIN Hash: ' + pinHash, 'highlight');
        log('📤 Sending to: ' + EDGE_URL + '/login-user', 'info');
        log('📤 Body: { mobile: "' + m + '", action: "login", pin: "' + p + '" }', 'info');

        var response = await fetch(EDGE_URL + '/login-user', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Authorization': 'Bearer ' + SB_KEY
            },
            body: JSON.stringify({
                mobile: m,
                action: 'login',
                pin: p  // Plain PIN - Edge Function hashes it
            })
        });

        var result = await response.json();
        showRawResponse(result);
        
        log('📥 Status: ' + response.status, 'info');
        log('📥 Response: ' + JSON.stringify(result, null, 2), 'info');

        var detail = 'Status: ' + response.status + 
            '\nSuccess: ' + (result.success === true ? '✅ YES' : '❌ NO') +
            '\nSource: ' + (result.source || 'unknown') +
            '\nIs New User: ' + (result.isNewUser === true ? 'YES' : 'NO');

                '\nPIN Hash: ' + (result.user.pinhash ? result.user.pinhash.substring(0, 20) + '...' : 'none');

        addStep(
            '🔐 Login Result',

            log('📊 DB PIN Hash: ' + dbHash, 'info');
            log('📊 Expected Hash: ' + pinHash, 'info');

                log('⚠️ Expected: ' + pinHash, 'warn');

        } else if (result.isNewUser === true) {
            log('ℹ️ New user - needs registration', 'warn');
            setStatus('ℹ️ New user - please register', 'pending');
            return result;
        } else if (result.source === 'archived') {
            log('📦 Archived account found', 'warn');
            setStatus('📦 Archived account', 'pending');
            return result;
        } else {
            log('❌ Login FAILED: ' + (result.error || 'Unknown error'), 'fail');

        var detail = 'Status: ' + response.status +
            '\nSuccess: ' + (result.success === true ? '✅ YES' : '❌ NO') +
            '\nSource: ' + (result.source || 'unknown');

        if (result.user) {
            detail += '\nUser Mobile: ' + result.user.mobile +
                '\nNew PIN Hash: ' + (result.user.pinhash ? result.user.pinhash.substring(0, 20) + '...' : 'none');
        }

        addStep(
            '🔄 Reset PIN Result',
            detail,
            result.success === true ? 'pass' : 'fail',
            result
        );

        if (result.success === true) {
            log('✅ PIN reset successfully!', 'pass');
            setStatus('✅ PIN reset successfully', 'success');
            // Update test PIN to new PIN
            document.getElementById('test-pin').value = newPin;
            updateTestValues();
            return result;
        } else {
            log('❌ Reset PIN FAILED: ' + (result.error || 'Unknown error'), 'fail');
            setStatus('❌ Reset PIN failed', 'error');
            return result;
        }
    } catch (e) {
        log('❌ Reset PIN error: ' + e.message, 'fail');
        setStatus('❌ Error: ' + e.message, 'error');
        addStep('❌ Reset PIN Error', e.message, 'fail');
        return null;
    }
}

// ============================================================
// TEST: Direct SQL Check
// ============================================================
async function testDirectSQL() {
    var m = getMobile();
    if (!m || m.length !== 10) {
        log('❌ Enter valid 10-digit mobile', 'fail');
        return;
    }

    var mobileNum = parseInt(m);
    log('🗄️ Direct SQL check for: ' + m + ' (BIGINT: ' + mobileNum + ')', 'info');
    setStatus('Querying database...', 'pending');

    try {
        // Check active_users
        var { data: active, error: activeErr } = await sb
            .from('active_users')
            .select('*')
            .eq('mobile', mobileNum)
            .maybeSingle();

        if (active) {
            log('✅ Found in active_users: ' + active.mobile + ' (type: ' + typeof active.mobile + ')', 'pass');
            addStep(
                '🗄️ Active Users Query',
                'Mobile: ' + active.mobile + ' (type: ' + typeof active.mobile + ')\n' +
                'PIN Hash: ' + (active.pinhash ? active.pinhash : 'Not set') + '\n' +
                'Name: ' + (active.name || 'Not set') + '\n' +
                'Company: ' + (active.company_name || 'Not set'),
                'pass',
                active
            );
            setStatus('✅ Found in active_users', 'success');
            return active;
        }

        // Check archived_users
        var { data: archived, error: archErr } = await sb
            .from('archived_users')
            .select('*')
            .eq('mobile', mobileNum)
            .maybeSingle();

        if (archived) {
            log('✅ Found in archived_users: ' + archived.mobile, 'pass');
            addStep(
                '🗄️ Archived Users Query',
                'Mobile: ' + archived.mobile + '\n' +
                'User Data: ' + JSON.stringify(archived.user_data, null, 2),
                'pass',
                archived
            );
            setStatus('✅ Found in archived_users', 'success');
            return archived;
        }

        log('❌ User NOT FOUND in any table', 'fail');
        addStep('🗄️ Direct SQL Query', 'User NOT FOUND in active_users or archived_users', 'fail');
        setStatus('❌ User not found in database', 'error');
        return null;
    } catch (e) {
        log('❌ Direct SQL error: ' + e.message, 'fail');
        setStatus('❌ Error: ' + e.message, 'error');
        return null;
    }
}

// ============================================================
// TEST: Full Flow
// ============================================================
async function testFullFlow() {
    log('🚀 Starting FULL FLOW test...', 'info');
    document.getElementById('steps-container').innerHTML = '';
    
    // Step 1: Check user
    log('📡 Step 1: Checking user existence', 'info');
    var checkResult = await testCheckUser();
    
    if (checkResult && checkResult.exists === true) {
        log('✅ User exists. Testing login...', 'pass');
        var loginResult = await testLogin();
        
        if (loginResult && loginResult.success === true) {
            log('✅ Login successful!', 'pass');
            
            // Step 3: Test change PIN
            log('🔑 Step 3: Testing PIN change...', 'info');
            var newPin = '5678';
            document.getElementById('test-pin').value = newPin;
            updateTestValues();
            await testChangePin();
            
            // Step 4: Test reset PIN
            log('🔄 Step 4: Testing PIN reset...', 'info');
            var resetPin = '1234';
            document.getElementById('test-pin').value = resetPin;
            updateTestValues();
            await testResetPin();
        } else if (loginResult && loginResult.isNewUser === true) {
            log('ℹ️ New user. Testing registration...', 'warn');
            await testRegister();
        }
    } else {
        log('ℹ️ New user. Testing registration...', 'warn');
        await testRegister();
        
        log('🔐 Testing login after registration...', 'info');
        await testLogin();
    }
    
    // Final SQL check
    log('🗄️ Final database check...', 'info');
    await testDirectSQL();
    
    log('✅ Full flow test completed!', 'pass');
    addStep('✅ Test Complete', 'All tests executed. Check results above.', 'pass');
    setStatus('✅ Full flow complete', 'success');
}
