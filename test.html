<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Login Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{box-sizing:border-box;font-family:system-ui,sans-serif}
        body{background:#f3f4f6;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
        .container{max-width:420px;width:100%;background:#fff;border-radius:24px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
        h1{color:#2563eb;font-size:20px;margin:0 0 4px}
        .sub{font-size:13px;color:#64748b;margin-bottom:16px}
        .input-group{margin-bottom:12px}
        .input-group label{font-size:11px;font-weight:700;color:#1e293b;display:block;margin-bottom:4px}
        .input-group input{width:100%;padding:12px 14px;border:2px solid #e2e8f0;border-radius:12px;font-size:16px;text-align:center;outline:none}
        .input-group input:focus{border-color:#2563eb}
        .btn{width:100%;padding:12px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:.2s;margin-bottom:6px}
        .btn-primary{background:#2563eb;color:#fff}
        .btn-primary:hover{background:#1d4ed8}
        .btn-success{background:#16a34a;color:#fff}
        .btn-danger{background:#dc2626;color:#fff}
        .btn-gray{background:#6b7280;color:#fff}
        .result{background:#f8fafc;border-radius:12px;padding:12px;margin-top:12px;font-size:13px;font-family:monospace;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow-y:auto}
        .pass{color:#16a34a}
        .fail{color:#dc2626}
        .info{color:#2563eb}
        .warn{color:#f59e0b}
        .log{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:12px;font-family:monospace;font-size:11px;max-height:150px;overflow-y:auto;margin-top:12px}
        .log .pass{color:#4ade80}
        .log .fail{color:#f87171}
        .log .info{color:#60a5fa}
        .hidden{display:none}
    </style>
</head>
<body>
<div class="container">
    <h1>🔐 Direct Login Test</h1>
    <div class="sub">Tests login by directly checking Supabase</div>

    <div class="input-group">
        <label>📱 Mobile Number</label>
        <input type="tel" id="mobile" placeholder="Enter 10-digit mobile" maxlength="10" value="6300067332">
    </div>

    <div class="input-group" id="pin-group" style="display:none;">
        <label>🔑 PIN</label>
        <input type="password" id="pin" placeholder="Enter 4-digit PIN" maxlength="4" style="letter-spacing:8px;">
    </div>

    <button class="btn btn-primary" id="btn-check" onclick="checkUser()">🔍 Check User</button>
    <button class="btn btn-success hidden" id="btn-login" onclick="loginUser()">🔐 Login</button>
    <button class="btn btn-success hidden" id="btn-register" onclick="registerUser()">📝 Register</button>
    <button class="btn btn-gray" onclick="clearLog()">🗑️ Clear</button>

    <div class="result" id="result">⏳ Click "Check User" to test</div>
    <div class="log" id="log">⏳ Waiting...</div>
</div>

<script>
var SB_URL = 'https://ghjoffovatgvhzxlupef.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdoam9mZm92YXRndmh6eGx1cGVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MDM4MjQsImV4cCI6MjEwMDk3OTgyNH0.bGDIHZDcLdZqJl9u5qhDm5mlGfWR3fp1sxrpwCtsDsg';
var sb = window.supabase.createClient(SB_URL, SB_KEY);

var currentMobile = null;
var currentUser = null;

function log(msg, type) {
    var el = document.getElementById('log');
    var time = new Date().toLocaleTimeString();
    var colors = { pass: 'pass', fail: 'fail', info: 'info' };
    el.innerHTML += '[' + time + '] <span class="' + (colors[type] || 'info') + '">' + msg + '</span>\n';
    el.scrollTop = el.scrollHeight;
}

function clearLog() {
    document.getElementById('log').innerHTML = '';
    document.getElementById('result').textContent = '⏳ Cleared';
}

function showResult(msg, color) {
    document.getElementById('result').innerHTML = msg;
    document.getElementById('result').style.color = color || '#1e293b';
}

async function checkUser() {
    var mobile = document.getElementById('mobile').value.trim();
    if (!mobile || mobile.length !== 10) {
        showResult('❌ Enter valid 10-digit mobile', '#dc2626');
        return;
    }

    currentMobile = mobile;
    var mobileNum = parseInt(mobile);
    
    log('🔍 Checking: ' + mobile + ' (as number: ' + mobileNum + ')', 'info');
    showResult('⏳ Checking user...', '#f59e0b');

    try {
        // Check active_users
        var { data: active, error: activeErr } = await sb
            .from('active_users')
            .select('*')
            .eq('mobile', mobileNum)
            .maybeSingle();

        if (active) {
            log('✅ Found in active_users! Mobile: ' + active.mobile, 'pass');
            log('   Name: ' + (active.name || 'Not set'), 'info');
            log('   PIN hash: ' + (active.pinhash ? 'Yes (hashed)' : 'No'), 'info');
            
            showResult(
                '✅ <strong>USER FOUND IN ACTIVE</strong>\n' +
                '📱 Mobile: ' + active.mobile + '\n' +
                '👤 Name: ' + (active.name || 'Not set') + '\n' +
                '🔑 PIN: ' + (active.pinhash ? '✅ Set' : '❌ Not set') + '\n\n' +
                '👉 Enter PIN and click "Login"',
                '#16a34a'
            );
            
            currentUser = active;
            document.getElementById('pin-group').style.display = 'block';
            document.getElementById('btn-login').classList.remove('hidden');
            document.getElementById('btn-register').classList.add('hidden');
            document.getElementById('pin').value = '';
            document.getElementById('pin').focus();
            return;
        }

        // Check archived_users
        var { data: archived, error: archErr } = await sb
            .from('archived_users')
            .select('*')
            .eq('mobile', mobileNum)
            .maybeSingle();

        if (archived) {
            log('✅ Found in archived_users!', 'pass');
            log('   Name: ' + (archived.user_data?.name || 'Not set'), 'info');
            
            showResult(
                '✅ <strong>USER FOUND IN ARCHIVE</strong>\n' +
                '📱 Mobile: ' + archived.mobile + '\n' +
                '👤 Name: ' + (archived.user_data?.name || 'Not set') + '\n\n' +
                '👉 Enter PIN and click "Login" (will restore)',
                '#16a34a'
            );
            
            currentUser = archived;
            document.getElementById('pin-group').style.display = 'block';
            document.getElementById('btn-login').classList.remove('hidden');
            document.getElementById('btn-register').classList.add('hidden');
            document.getElementById('pin').value = '';
            document.getElementById('pin').focus();
            return;
        }

        // New user
        log('❌ User NOT found in active or archived', 'fail');
        showResult(
            '❌ <strong>USER NOT FOUND</strong>\n' +
            '📱 Mobile: ' + mobile + '\n\n' +
            '👉 Click "Register" to create new account',
            '#dc2626'
        );
        
        document.getElementById('pin-group').style.display = 'block';
        document.getElementById('btn-login').classList.add('hidden');
        document.getElementById('btn-register').classList.remove('hidden');
        document.getElementById('pin').value = '';
        document.getElementById('pin').focus();

    } catch (err) {
        log('❌ Error: ' + err.message, 'fail');
        showResult('❌ Error: ' + err.message, '#dc2626');
    }
}

async function loginUser() {
    var pin = document.getElementById('pin').value.trim();
    if (!pin || pin.length !== 4) {
        showResult('❌ Enter 4-digit PIN', '#dc2626');
        return;
    }

    log('🔐 Login attempt for: ' + currentMobile, 'info');
    showResult('⏳ Verifying PIN...', '#f59e0b');

    try {
        // Hash PIN
        var encoder = new TextEncoder();
        var data = encoder.encode(pin);
        var hashBuffer = await crypto.subtle.digest('SHA-256', data);
        var hashArray = Array.from(new Uint8Array(hashBuffer));
        var pinhash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        log('   PIN hash: ' + pinhash.substring(0, 16) + '...', 'info');

        var mobileNum = parseInt(currentMobile);

        // Check if user exists with this PIN
        var { data: user, error: userErr } = await sb
            .from('active_users')
            .select('*')
            .eq('mobile', mobileNum)
            .eq('pinhash', pinhash)
            .maybeSingle();

        if (user) {
            log('✅ LOGIN SUCCESSFUL! 🎉', 'pass');
            showResult(
                '✅ <strong>LOGIN SUCCESSFUL!</strong> 🎉\n' +
                '📱 Mobile: ' + user.mobile + '\n' +
                '👤 Name: ' + (user.name || 'Not set') + '\n' +
                '🏢 Company: ' + (user.company_name || 'Not set'),
                '#16a34a'
            );
            document.getElementById('btn-login').textContent = '✅ Logged In!';
            document.getElementById('btn-login').disabled = true;
            return;
        }

        // Check if user exists but PIN is wrong
        var { data: exists, error: existsErr } = await sb
            .from('active_users')
            .select('mobile')
            .eq('mobile', mobileNum)
            .maybeSingle();

        if (exists) {
            log('❌ Incorrect PIN for existing user', 'fail');
            showResult('❌ <strong>Incorrect PIN</strong>\nPlease try again.', '#dc2626');
            document.getElementById('pin').value = '';
            document.getElementById('pin').focus();
            return;
        }

        log('❌ User not found with this PIN', 'fail');
        showResult('❌ <strong>User not found</strong>\nPlease register.', '#dc2626');

    } catch (err) {
        log('❌ Login error: ' + err.message, 'fail');
        showResult('❌ Error: ' + err.message, '#dc2626');
    }
}

async function registerUser() {
    var pin = document.getElementById('pin').value.trim();
    if (!pin || pin.length !== 4) {
        showResult('❌ Enter 4-digit PIN', '#dc2626');
        return;
    }

    log('📝 Registering: ' + currentMobile, 'info');
    showResult('⏳ Registering...', '#f59e0b');

    try {
        var encoder = new TextEncoder();
        var data = encoder.encode(pin);
        var hashBuffer = await crypto.subtle.digest('SHA-256', data);
        var hashArray = Array.from(new Uint8Array(hashBuffer));
        var pinhash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

        var mobileNum = parseInt(currentMobile);

        // Check if already exists
        var { data: exists } = await sb
            .from('active_users')
            .select('mobile')
            .eq('mobile', mobileNum)
            .maybeSingle();

        if (exists) {
            log('❌ User already exists!', 'fail');
            showResult('❌ <strong>User already exists</strong>\nPlease login instead.', '#dc2626');
            return;
        }

        // Create new user
        var { data: newUser, error: insertErr } = await sb
            .from('active_users')
            .insert({
                mobile: mobileNum,
                pinhash: pinhash,
                last_active: new Date().toISOString()
            })
            .select()
            .single();

        if (insertErr) {
            log('❌ Register error: ' + insertErr.message, 'fail');
            showResult('❌ Error: ' + insertErr.message, '#dc2626');
            return;
        }

        log('✅ REGISTRATION SUCCESSFUL! 🎉', 'pass');
        showResult(
            '✅ <strong>REGISTRATION SUCCESSFUL!</strong> 🎉\n' +
            '📱 Mobile: ' + newUser.mobile + '\n' +
            '🔑 PIN set successfully\n\n' +
            '👉 Click "Login" with your PIN',
            '#16a34a'
        );
        document.getElementById('btn-register').textContent = '✅ Registered!';
        document.getElementById('btn-register').disabled = true;
        document.getElementById('btn-login').classList.remove('hidden');

    } catch (err) {
        log('❌ Register error: ' + err.message, 'fail');
        showResult('❌ Error: ' + err.message, '#dc2626');
    }
}

// Enter key handlers
document.getElementById('mobile').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkUser();
});
document.getElementById('pin').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        if (!document.getElementById('btn-login').classList.contains('hidden')) {
            loginUser();
        } else if (!document.getElementById('btn-register').classList.contains('hidden')) {
            registerUser();
        }
    }
});

// Init
log('🚀 Direct Login Test initialized', 'info');
log('📱 Enter mobile and click "Check User"', 'info');
</script>
</body>
</html>
