        // ============================================================

            { pin_id: 50000802, pincode: "500008", name: "Lungeruse", district: "HYDERABAD", state: "TG", lat: 17.37586111,

        // ============================================================
        // HELPER FUNCTIONS
        // ============================================================
        function getLoc(pinId) {
            if (!pinId) return null;
            const pinNum = parseInt(pinId);
            if (isNaN(pinNum)) return null;
            const exact = LOCATIONS.find(l => l.pin_id === pinNum);
            if (exact) return exact;
            const pinStr = String(pinNum);
            if (pinStr.length >= 6) {
                const pincode = pinStr.substring(0, 6);
                const matches = LOCATIONS.filter(l => l.pincode === pincode);
                if (matches.length > 0) {
                    const exact2 = matches.find(l => l.pin_id === pinNum);
                    if (exact2) return exact2;
                    return matches[0];
                }
            }
            return null;
        }

        function getLocDisplayName(loc) {
            if (!loc) return 'Unknown';
            return loc.name + ', ' + loc.district + ', ' + loc.state + ' (' + loc.pincode + ')';
        }

        function getLocName(pinId) {
            const l = getLoc(pinId);
            return l ? getLocDisplayName(l) : pinId || 'Unknown';
        }

        function dist(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function formatIndianNumber(num) {
            if (num === undefined || num === null || isNaN(num)) return '0';
            return Number(num).toLocaleString('en-IN');
        }

        function addResult(html) {
            const container = document.getElementById('results');
            container.innerHTML += html;
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        function getPincode(pinId) {
            const loc = getLoc(pinId);
            if (loc) return String(loc.pincode);
            const pinStr = String(pinId);
            if (pinStr.length >= 6) return pinStr.substring(0, 6);
            return pinStr;
        }

        // ============================================================
        // MAIN TEST FUNCTION
        // ============================================================
        async function testWithToLocation(homePinId, toPinId) {
            const container = document.getElementById('results');
            const radius = 100;

            const homeName = getLocName(homePinId);
            const toName = toPinId ? getLocName(toPinId) : 'None';

            container.innerHTML =
                `<div class="card"><h3>⏳ Testing: Home=${homeName} → To=${toName} (Radius: ${radius} KM)</h3></div>`;

            try {
                // Fetch data
                const [loadsRes, trucksRes] = await Promise.all([
                    sb.from('active_loads').select('*').eq('status', 1),
                    sb.from('active_trucks').select('*').eq('status', 1)
                ]);

                const loads = loadsRes.data || [];
                const trucks = trucksRes.data || [];

                // ---- FILTER: Home Location ----
                let filtered = [];

                // For loads: from_pin = pickup_pin
                loads.forEach(l => {
                    const fl = getLoc(l.pickup_pin);
                    let inRadius = false;
                    let distance = 'N/A';
                    let homeMatch = false;

                    if (fl) {
                        distance = dist(getLoc(homePinId).lat, getLoc(homePinId).lng, fl.lat, fl.lng);
                        inRadius = distance <= radius;
                        homeMatch = inRadius;
                    } else {
                        const itemPincode = getPincode(l.pickup_pin);
                        const searchPincode = getPincode(homePinId);
                        if (itemPincode === searchPincode) {
                            homeMatch = true;
                        }
                    }

                    if (homeMatch) {
                        filtered.push({
                            ...l,
                            type: 'LOAD',
                            from_pin: l.pickup_pin,
                            to_pin: l.drop_pin,
                            distance: distance,
                            homeMatch: true
                        });
                    }
                });

                // Trucks: from_pin = location_pin
                trucks.forEach(t => {
                    const fl = getLoc(t.location_pin);
                    let inRadius = false;
                    let distance = 'N/A';
                    let homeMatch = false;

                    if (fl) {
                        distance = dist(getLoc(homePinId).lat, getLoc(homePinId).lng, fl.lat, fl.lng);
                        inRadius = distance <= radius;
                        homeMatch = inRadius;
                    } else {
                        const itemPincode = getPincode(t.location_pin);
                        const searchPincode = getPincode(homePinId);
                        if (itemPincode === searchPincode) {
                            homeMatch = true;
                        }
                    }

                    if (homeMatch) {
                        filtered.push({
                            ...t,
                            type: 'TRUCK',
                            from_pin: t.location_pin,
                            to_pin: null,
                            distance: distance,
                            homeMatch: true
                        });
                    }
                });

                // ---- FILTER: To Location ----
                const toFiltered = [];
                const toLoc = toPinId ? getLoc(toPinId) : null;
                const toPincode = toLoc ? String(toLoc.pincode) : null;

                filtered.forEach(item => {
                    if (item.type === 'LOAD' && toPinId) {
                        // Check drop_pin against To Location
                        const tl2 = getLoc(item.drop_pin);
                        let toMatch = false;
                        let toDistance = 'N/A';

                        if (tl2 && toLoc) {
                            toDistance = dist(toLoc.lat, toLoc.lng, tl2.lat, tl2.lng);
                            toMatch = toDistance <= radius;
                        } else if (toLoc) {
                            const itemPincode = getPincode(item.drop_pin);
                            if (itemPincode === toPincode) {
                                toMatch = true;
                                toDistance = 'Same Pincode Area';
                            } else {
                                // Try to find location by pincode
                                const locMatch = getLoc(item.drop_pin);
                                if (locMatch) {
                                    toDistance = dist(toLoc.lat, toLoc.lng, locMatch.lat, locMatch.lng);
                                    toMatch = toDistance <= radius;
                                }
                            }
                        } else {
                            toMatch = true;
                        }

                        if (toMatch) {
                            toFiltered.push({ ...item, toMatch: true, toDistance: toDistance });
                        } else {
                            toFiltered.push({ ...item, toMatch: false, toDistance: toDistance, filtered_out: true });
                        }
                    } else {
                        // Trucks and Agents pass through (they don't have "to" location)
                        toFiltered.push({ ...item, toMatch: true, toDistance: 'N/A' });
                    }
                });

                // ---- Build Results ----
                let html = '';

                // Summary
                html += `<div class="card">`;
                html += `<h3>📍 Results: Home=${homeName} → To=${toName}</h3>`;
                html += `<div class="flex">`;
                html += `<span class="info">🔍 Home PIN: ${homePinId}</span>`;
                html += `<span class="info">📍 Home Pincode: ${getPincode(homePinId)}</span>`;
                html += `<span class="info">📌 To PIN: ${toPinId || 'None'}</span>`;
                html += `<span class="info">📍 To Pincode: ${toPincode || 'N/A'}</span>`;
                html += `<span class="info">📏 Radius: ${radius} KM</span>`;
                html += `</div>`;
                html += `<p class="info">📊 Found ${loads.length} loads, ${trucks.length} trucks</p>`;

                const totalMatches = toFiltered.filter(i => i.toMatch !== false).length;
                const totalFiltered = toFiltered.filter(i => i.filtered_out === true).length;
                html +=
                    `<p class="result-count">✅ Passed: ${totalMatches} | ❌ Filtered Out: ${totalFiltered} | 📦 Total: ${toFiltered.length}</p>`;
                html += `</div>`;

                // ---- Table ----
                html += `<div class="card"><h3>📋 All Items (${toFiltered.length})</h3>`;
                if (toFiltered.length === 0) {
                    html += `<p class="error">❌ No items found within home radius</p>`;
                } else {
                    html += `<table>
                        <tr>
                            <th>Type</th>
                            <th>Title</th>
                            <th>From (pickup)</th>
                            <th>To (drop)</th>
                            <th>To Distance</th>
                            <th>Status</th>
                        </tr>`;

                    toFiltered.forEach(item => {
                        const type = item.type || 'LOAD';
                        const title = item.material || item.truck_no || 'Unknown';
                        const fromName = getLocName(item.from_pin);
                        const toName2 = item.to_pin ? getLocName(item.to_pin) : 'N/A';

                        const isPass = item.toMatch !== false;
                        const statusText = isPass ? '✅ PASS' : '❌ FILTERED OUT';
                        const statusColor = isPass ? 'color:#4ade80;' : 'color:#f87171;';

                        const distanceDisplay = typeof item.toDistance === 'number' ?
                            item.toDistance.toFixed(1) + ' KM' :
                            item.toDistance;

                        html += `<tr style="${statusColor}">
                            <td><span class="badge ${type === 'LOAD' ? 'load' : 'truck'}">${type}</span></td>
                            <td>${title}</td>
                            <td>${fromName}</td>
                            <td>${toName2}</td>
                            <td>${distanceDisplay}</td>
                            <td><strong>${statusText}</strong></td>
                        </tr>`;
                    });

                    html += `</table>`;
                }
                html += `</div>`;

                // ---- Explanation ----
                html += `<div class="card"><h3>📖 How To Location Filter Works</h3>`;
                html += `<p class="info"><strong>1. Home Filter:</strong> All items must be within ${radius} KM of Home Location</p>`;
                html +=
                    `<p class="info"><strong>2. To Location Filter:</strong> Only LOADS with drop_pin within ${radius} KM of To Location pass</p>`;
                html += `<p class="info"><strong>3. Trucks/Agents:</strong> Always pass (they don't have "to" location)</p>`;
                html +=
                    `<p class="info"><strong>4. Pincode Matching:</strong> If exact location not found, matches first 6 digits</p>`;

                if (toFiltered.filter(i => i.filtered_out === true).length > 0) {
                    html += `<p class="success">✅ To Location filter is WORKING! Some items were filtered out.</p>`;
                } else if (toPinId) {
                    html += `<p class="error">⚠️ To Location filter may NOT be working. No items were filtered out.</p>`;
                }
                html += `</div>`;

                container.innerHTML = html;

            } catch (error) {
                container.innerHTML =
                    `<div class="card"><h3 class="error">❌ Error</h3><p>${error.message}</p></div>`;
                console.error(error);
            }
        }

        // ============================================================
        // SHOW ALL DATA
        // ============================================================
        async function showAllData() {
            const container = document.getElementById('results');
            container.innerHTML = `<div class="card"><h3>⏳ Loading all data...</h3></div>`;

            try {
                const [loadsRes, trucksRes] = await Promise.all([
                    sb.from('active_loads').select('*').eq('status', 1),
                    sb.from('active_trucks').select('*').eq('status', 1)
                ]);

                const loads = loadsRes.data || [];
                const trucks = trucksRes.data || [];

                let html = '';
                html += `<div class="card"><h3>📊 All Data Summary</h3>`;
                html += `<p class="success">✅ Loads: ${loads.length}</p>`;
                html += `<p class="success">✅ Trucks: ${trucks.length}</p>`;
                html += `</div>`;

                // Loads
                html += `<div class="card"><h3>📦 All Loads</h3>`;
                if (loads.length === 0) {
                    html += `<p class="error">❌ No loads found</p>`;
                } else {
                    html += `<table>
                        <tr><th>ID</th><th>Material</th><th>pickup_pin</th><th>drop_pin</th><th>Pickup Location</th><th>Drop Location</th></tr>`;
                    loads.forEach(l => {
                        const pickup = getLocName(l.pickup_pin);
                        const drop = getLocName(l.drop_pin);
                        html += `<tr>
                            <td>${l.id}</td>
                            <td>${l.material || 'N/A'}</td>
                            <td>${l.pickup_pin}</td>
                            <td>${l.drop_pin}</td>
                            <td>${pickup}</td>
                            <td>${drop}</td>
                        </tr>`;
                    });
                    html += `</table>`;
                }
                html += `</div>`;

                // Trucks
                html += `<div class="card"><h3>🚛 All Trucks</h3>`;
                if (trucks.length === 0) {
                    html += `<p class="error">❌ No trucks found</p>`;
                } else {
                    html += `<table>
                        <tr><th>ID</th><th>Truck No</th><th>location_pin</th><th>Location</th></tr>`;
                    trucks.forEach(t => {
                        const loc = getLocName(t.location_pin);
                        html += `<tr>
                            <td>${t.id}</td>
                            <td>${t.truck_no || 'N/A'}</td>
                            <td>${t.location_pin}</td>
                            <td>${loc}</td>
                        </tr>`;
                    });
                    html += `</table>`;
                }
                html += `</div>`;

                // Test data
                html += `<div class="card"><h3>🧪 Test Scenarios</h3>`;
                html += `<div class="flex">`;
                html +=
                    `<button onclick="testWithToLocation(50000101, 53300104)">📍 Hyderabad → Kakinada (should show only loads with drop=Kakinada)</button>`;
                html +=
                    `<button onclick="testWithToLocation(50000101, 52400103)">📍 Hyderabad → Nellore (should show only loads with drop=Nellore)</button>`;
                html +=
                    `<button onclick="testWithToLocation(53300104, 50000101)">📍 Kakinada → Hyderabad (should show only loads with drop=Hyderabad)</button>`;
                html += `</div>`;
                html += `</div>`;

                container.innerHTML = html;

            } catch (error) {
                container.innerHTML =
                    `<div class="card"><h3 class="error">❌ Error</h3><p>${error.message}</p></div>`;
                console.error(error);
            }
        }

        // ============================================================
        // AUTO RUN ON LOAD
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            showAllData();
        });
