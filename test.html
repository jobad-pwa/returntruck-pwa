<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge Function Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{box-sizing:border-box;font-family:system-ui,sans-serif}
        body{background:#f3f4f6;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
        .container{max-width:480px;width:100%;background:#fff;border-radius:24px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
        h1{color:#2563eb;font-size:20px;margin:0 0 4px}
        .sub{font-size:13px;color:#64748b;margin-bottom:16px}
        .input-group{margin-bottom:12px}
        .input-group label{font-size:11px;font-weight:700;color:#1e293b;display:block;margin-bottom:4px}
        .input-group input{width:100%;padding:12px 14px;border:2px solid #e2e8f0;border-radius:12px;font-size:16px;text-align:center;outline:none}
        .input-group input:focus{border-color:#2563eb}
        .btn{width:100%;padding:12px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:.2s;margin-bottom:6px}
        .btn-primary{background:#2563eb;color:#fff}
        .btn-primary:hover{background:#1d4ed8}
        .btn-success{background:#16a34a;color:#fff}
        .btn-danger{background:#dc2626;color:#fff}
        .btn-gray{background:#6b7280;color:#fff}
        .btn-warning{background:#f59e0b;color:#000}
        .result{background:#f8fafc;border-radius:12px;padding:16px;margin-top:12px;font-size:13px;font-family:monospace;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}
        .pass{color:#16a34a;font-weight:600}
        .fail{color:#dc2626;font-weight:600}
        .info{color:#2563eb;font-weight:600}
        .warn{color:#f59e0b;font-weight:600}
        .log{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:12px;font-family:monospace;font-size:11px;max-height:150px;overflow-y:auto;margin-top:12px}
        .log .pass{color:#4ade80}
        .log .fail{color:#f87171}
        .log .info{color:#60a5fa}
        .step-box{background:#f1f5f9;border-radius:12px;padding:12px;margin:8px 0;border-left:4px solid #94a3b8}
        .step-box .step-title{font-weight:700;font-size:13px;color:#1e293b}
        .step-box .step-detail{font-size:12px;color:#475569;margin-top:4px;font-family:monospace}
        .step-box.pass{border-left-color:#16a34a;background:#f0fdf4}
        .step-box.fail{border-left-color:#dc2626;background:#fef2f2}
        .dt-info{background:#dbeafe;border-radius:8px;padding:12px;margin:8px 0;font-size:12px}
        .dt-info strong{color:#1e40af}
    </style>
</head>
<body>
<div class="container">
    <h1>🔍 Edge Function Test</h1>
    <div class="sub">Tests check user via Edge Function with data type tracking</div>

    <div class="dt-info">
        <strong>📊 Data Type Info:</strong><br>
        Input from HTML: <span id="input-type-display">string</span><br>
        Converted to BIGINT: <span id="bigint-display">number</span><br>
        Supabase Column: BIGINT (number)
    </div>

    <div class="input-group">
        <label>📱 Mobile Number</label>
        <input type="tel" id="mobile" placeholder="Enter 10-digit mobile" maxlength="10" value="6300067332">
    </div>

    <button class="btn btn-primary" onclick="runTest()">🚀 Run Test</button>
    <button class="btn btn-warning" onclick="testDirect()">📡 Test Edge Function Only</button>
    <button class="btn btn-success" onclick="testDirectSQL()">🗄️ Test Direct SQL</button>
    <button class="btn btn-gray" onclick="clearAll()">🗑️ Clear</button>

    <div id="steps-container"></div>
    <div class="result" id="result">⏳ Enter mobile and click "Run Test"</div>
    <div class="log" id="log">⏳ Waiting...</div>
</div>

<script>
var SB_URL = 'https://ghjoffovatgvhzxlupef.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdoam9mZm92YXRndmh6eGx1cGVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MDM4MjQsImV4cCI6MjEwMDk3OTgyNH0.bGDIHZDcLdZqJl9u5qhDm5mlGfWR3fp1sxrpwCtsDsg';
var EDGE_URL = 'https://ghjoffovatgvhzxlupef.supabase.co/functions/v1';
var sb = window.supabase.createClient(SB_URL, SB_KEY);

function log(msg, type) {
    var el = document.getElementById('log');
    var time = new Date().toLocaleTimeString();
    var colors = { pass: 'pass', fail: 'fail', info: 'info', warn: 'warn' };
    el.innerHTML += '[' + time + '] <span class="' + (colors[type] || 'info') + '">' + msg + '</span>\n';
    el.scrollTop = el.scrollHeight;
}

function clearAll() {
    document.getElementById('log').innerHTML = '';
    document.getElementById('result').innerHTML = '⏳ Cleared';
    document.getElementById('steps-container').innerHTML = '';
    log('🗑️ Cleared', 'info');
}

function addStep(title, detail, status) {
    var container = document.getElementById('steps-container');
    var cls = 'step-box';
    if (status === 'pass') cls += ' pass';
    else if (status === 'fail') cls += ' fail';
    
    var html = '<div class="' + cls + '">';
    html += '<div class="step-title">' + title + '</div>';
    html += '<div class="step-detail">' + detail + '</div>';
    html += '</div>';
    container.innerHTML += html;
}

function showResult(msg, color) {
    document.getElementById('result').innerHTML = msg;
    document.getElementById('result').style.color = color || '#1e293b';
}

function updateDataTypeDisplay(inputVal) {
    var inputType = typeof inputVal;
    var bigintVal = parseInt(inputVal);
    var bigintType = typeof bigintVal;
    
    document.getElementById('input-type-display').textContent = inputType + ' ("' + inputVal + '")';
    document.getElementById('bigint-display').textContent = bigintType + ' (' + bigintVal + ')';
}

// ============================================================
// RUN FULL TEST - FIXED with Authorization Header
// ============================================================
async function runTest() {
    var mobile = document.getElementById('mobile').value.trim();
    if (!mobile || mobile.length !== 10) {
        showResult('❌ Enter valid 10-digit mobile', '#dc2626');
        return;
    }

    document.getElementById('steps-container').innerHTML = '';
    log('🚀 Starting full test for: ' + mobile, 'info');
    
    var mobileNum = parseInt(mobile);
    updateDataTypeDisplay(mobile);
    
    addStep(
        '📱 Step 1: Input Value',
        'HTML Input: "' + mobile + '" (type: ' + typeof mobile + ')<br>Parsed BIGINT: ' + mobileNum + ' (type: ' + typeof mobileNum + ')',
        'pass'
    );
    
    showResult('⏳ Testing...', '#f59e0b');

    // ============================================================
    // TEST 1: Edge Function - NOW WITH AUTHENTICATION
    // ============================================================
    addStep(
        '📡 Step 2: Calling Edge Function',
        'URL: ' + EDGE_URL + '/login-user<br>Payload: { mobile: "' + mobile + '", action: "check" }',
        'pending'
    );
    
    try {
        var startTime = Date.now();
        var response = await fetch(EDGE_URL + '/login-user', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Authorization': 'Bearer ' + SB_KEY  // ✅ FIXED: Added authorization header
            },
            body: JSON.stringify({ mobile: mobile, action: 'check' })
        });
        var endTime = Date.now();
        var result = await response.json();
        
        var timeTaken = endTime - startTime;
        
        addStep(
            '📡 Step 2: Edge Function Response',
            'Time: ' + timeTaken + 'ms<br>Status: ' + response.status + '<br>Response: ' + JSON.stringify(result, null, 2),
            result.exists === true ? 'pass' : 'fail'
        );
        
        log('📡 Edge Function response: ' + JSON.stringify(result), result.exists === true ? 'pass' : 'fail');
        
        if (result.exists === true) {
            addStep(
                '✅ Edge Function Result',
                'User FOUND in: ' + (result.source || 'unknown') + '<br>Mobile: ' + (result.user?.mobile || 'N/A') + '<br>Name: ' + (result.user?.name || 'Not set'),
                'pass'
            );
        } else {
            addStep(
                '❌ Edge Function Result',
                'User NOT FOUND<br>Source: ' + (result.source || 'unknown') + '<br>Error: ' + (result.error || 'None'),
                'fail'
            );
        }
    } catch (err) {
        addStep(
            '❌ Edge Function Error',
            'Error: ' + err.message,
            'fail'
        );
        log('❌ Edge Function error: ' + err.message, 'fail');
    }

    // ============================================================
    // TEST 2: Direct SQL Query
    // ============================================================
    addStep(
        '🗄️ Step 3: Direct SQL Query',
        'Query: active_users WHERE mobile = ' + mobileNum + ' (BIGINT)',
        'pending'
    );
    
    try {
        var { data: active, error: activeErr } = await sb
            .from('active_users')
            .select('*')
            .eq('mobile', mobileNum)
            .maybeSingle();
        
        if (active) {
            addStep(
                '✅ Direct SQL Result',
                'User FOUND in active_users!<br>Mobile: ' + active.mobile + ' (type: ' + typeof active.mobile + ')<br>PIN Hash: ' + (active.pinhash ? active.pinhash.substring(0, 20) + '...' : 'Not set') + '<br>Name: ' + (active.name || 'Not set'),
                'pass'
            );
            log('✅ Direct SQL found user: ' + active.mobile, 'pass');
        } else {
            // Check archive
            var { data: archived, error: archErr } = await sb
                .from('archived_users')
                .select('*')
                .eq('mobile', mobileNum)
                .maybeSingle();
            
            if (archived) {
                addStep(
                    '✅ Direct SQL Result',
                    'User FOUND in archived_users!<br>Mobile: ' + archived.mobile + '<br>Name: ' + (archived.user_data?.name || 'Not set'),
                    'pass'
                );
                log('✅ Direct SQL found user in archive: ' + archived.mobile, 'pass');
            } else {
                addStep(
                    '❌ Direct SQL Result',
                    'User NOT FOUND in active or archived tables',
                    'fail'
                );
                log('❌ Direct SQL: User not found', 'fail');
            }
        }
    } catch (err) {
        addStep(
            '❌ Direct SQL Error',
            'Error: ' + err.message,
            'fail'
        );
        log('❌ Direct SQL error: ' + err.message, 'fail');
    }

    // ============================================================
    // SUMMARY
    // ============================================================
    var summary = '📊 <strong>SUMMARY</strong>\n\n';
    summary += '🔹 Input: "' + mobile + '" → BIGINT: ' + mobileNum + '\n';
    summary += '🔹 Edge Function: ' + (result?.exists === true ? '✅ Found' : '❌ Not Found') + '\n';
    summary += '🔹 Direct SQL: ' + (active ? '✅ Found in active' : archived ? '✅ Found in archive' : '❌ Not Found') + '\n\n';
    
    if (result?.exists === true && active) {
        summary += '✅ <span class="pass">BOTH Edge Function AND Direct SQL found the user</span>\n';
        summary += '📌 The issue is in your main app, not the Edge Function.';
    } else if (result?.exists !== true && active) {
        summary += '⚠️ <span class="warn">Edge Function says NOT FOUND, but Direct SQL says FOUND</span>\n';
        summary += '📌 The Edge Function is NOT detecting the user!\n';
        summary += '🔧 Check: Edge Function code, deployment, or CORS.';
    } else if (result?.exists === true && !active) {
        summary += '⚠️ <span class="warn">Edge Function says FOUND, but Direct SQL says NOT FOUND</span>\n';
        summary += '📌 The Edge Function is returning false positives!';
    } else {
        summary += '❌ <span class="fail">User NOT FOUND in either check</span>\n';
        summary += '📌 The user does not exist in the database.';
    }
    
    showResult(summary, '#1e293b');
    log('✅ Test completed', 'pass');
}

// ============================================================
// TEST EDGE FUNCTION ONLY - FIXED with Authorization Header
// ============================================================
async function testDirect() {
    var mobile = document.getElementById('mobile').value.trim();
    if (!mobile || mobile.length !== 10) {
        showResult('❌ Enter valid 10-digit mobile', '#dc2626');
        return;
    }
    
    document.getElementById('steps-container').innerHTML = '';
    log('📡 Testing Edge Function only for: ' + mobile, 'info');
    
    try {
        var response = await fetch(EDGE_URL + '/login-user', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Authorization': 'Bearer ' + SB_KEY  // ✅ FIXED: Added authorization header
            },
            body: JSON.stringify({ mobile: mobile, action: 'check' })
        });
        var result = await response.json();
        
        var resultHTML = '📡 <strong>Edge Function Response</strong>\n\n';
        resultHTML += 'Status: ' + response.status + '\n';
        resultHTML += 'Response: ' + JSON.stringify(result, null, 2) + '\n\n';
        
        if (result.exists === true) {
            resultHTML += '✅ <span class="pass">User FOUND</span>\n';
            resultHTML += 'Source: ' + (result.source || 'unknown') + '\n';
            resultHTML += 'Mobile: ' + (result.user?.mobile || 'N/A');
        } else {
            resultHTML += '❌ <span class="fail">User NOT FOUND</span>';
        }
        
        showResult(resultHTML, '#1e293b');
        log('📡 Edge Function result: ' + JSON.stringify(result), result.exists === true ? 'pass' : 'fail');
    } catch (err) {
        showResult('❌ Error: ' + err.message, '#dc2626');
        log('❌ Error: ' + err.message, 'fail');
    }
}

// ============================================================
// TEST DIRECT SQL (No changes needed - already works)
// ============================================================
async function testDirectSQL() {
    var mobile = document.getElementById('mobile').value.trim();
    if (!mobile || mobile.length !== 10) {
        showResult('❌ Enter valid 10-digit mobile', '#dc2626');
        return;
    }
    
    var mobileNum = parseInt(mobile);
    document.getElementById('steps-container').innerHTML = '';
    log('🗄️ Testing Direct SQL for: ' + mobile + ' (BIGINT: ' + mobileNum + ')', 'info');
    
    try {
        var { data: active, error: activeErr } = await sb
            .from('active_users')
            .select('*')
            .eq('mobile', mobileNum)
            .maybeSingle();
        
        var resultHTML = '🗄️ <strong>Direct SQL Query Result</strong>\n\n';
        resultHTML += 'Query: active_users WHERE mobile = ' + mobileNum + '\n\n';
        
        if (active) {
            resultHTML += '✅ <span class="pass">User FOUND in active_users</span>\n\n';
            resultHTML += '📱 Mobile: ' + active.mobile + ' (type: ' + typeof active.mobile + ')\n';
            resultHTML += '🔑 PIN Hash: ' + (active.pinhash ? active.pinhash.substring(0, 20) + '...' : 'Not set') + '\n';
            resultHTML += '👤 Name: ' + (active.name || 'Not set') + '\n';
            resultHTML += '🏢 Company: ' + (active.company_name || 'Not set');
            log('✅ Found in active_users: ' + active.mobile, 'pass');
        } else {
            var { data: archived, error: archErr } = await sb
                .from('archived_users')
                .select('*')
                .eq('mobile', mobileNum)
                .maybeSingle();
            
            if (archived) {
                resultHTML += '✅ <span class="pass">User FOUND in archived_users</span>\n\n';
                resultHTML += '📱 Mobile: ' + archived.mobile + '\n';
                resultHTML += '👤 Name: ' + (archived.user_data?.name || 'Not set');
                log('✅ Found in archived_users: ' + archived.mobile, 'pass');
            } else {
                resultHTML += '❌ <span class="fail">User NOT FOUND</span>\n';
                resultHTML += '📌 Not in active_users or archived_users';
                log('❌ User not found in any table', 'fail');
            }
        }
        
        showResult(resultHTML, '#1e293b');
    } catch (err) {
        showResult('❌ Error: ' + err.message, '#dc2626');
        log('❌ Error: ' + err.message, 'fail');
    }
}

// Enter key
document.getElementById('mobile').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') runTest();
});

// Init
log('🚀 Edge Function Test initialized', 'info');
log('📱 Enter mobile and click "Run Test"', 'info');
</script>
</body>
</html>
