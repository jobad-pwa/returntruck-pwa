<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Debug - ReturnTruck</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#f3f4f6;padding:20px;display:flex;justify-content:center}
.container{max-width:420px;width:100%;background:#fff;border-radius:24px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
h2{color:#2563eb;font-size:18px;margin:0 0 4px 0}
.sub{font-size:12px;color:#64748b;margin-bottom:16px}
.test-group{margin-bottom:16px}
.test-group label{font-size:11px;font-weight:700;color:#1e293b;display:block;margin-bottom:4px}
.search-wrapper{position:relative;width:100%}
.search-wrapper input{width:100%;padding:10px 12px;border:2px solid #e2e8f0;border-radius:12px;font-size:14px;outline:none}
.search-wrapper input:focus{border-color:#2563eb}
.search-wrapper .suggestions{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin-top:4px;max-height:180px;overflow-y:auto;z-index:50;display:none;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.search-wrapper .suggestions.show{display:block}
.search-wrapper .suggestions .item{padding:10px 16px;font-size:13px;color:#1e293b;cursor:pointer}
.search-wrapper .suggestions .item:hover{background:#f8fafc}
.search-wrapper .suggestions .item .highlight{background:#dbeafe;font-weight:600}
.console-box{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:12px;font-family:monospace;font-size:11px;max-height:200px;overflow-y:auto;margin-top:12px;white-space:pre-wrap;word-break:break-all}
.console-box .ok{color:#4ade80}
.console-box .err{color:#f87171}
.console-box .info{color:#60a5fa}
.console-box .warn{color:#fbbf24}
.pass{color:#16a34a;font-weight:600}
.fail{color:#dc2626;font-weight:600}
.pending{color:#f59e0b;font-weight:600}
.status-box{background:#f8fafc;border-radius:12px;padding:12px;margin-top:12px;font-size:12px}
.status-box .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f1f5f9}
.status-box .row:last-child{border-bottom:none}
.btn-group{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn-group button{flex:1;min-width:80px;padding:10px 8px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px}
.btn-blue{background:#2563eb;color:#fff}
.btn-purple{background:#8b5cf6;color:#fff}
.btn-gray{background:#6b7280;color:#fff}
.btn-red{background:#dc2626;color:#fff}
.btn-green{background:#16a34a;color:#fff}
</style>
</head>
<body>
<div class="container">
    <h2>🔍 Search Debug</h2>
    <div class="sub">Testing why TO search doesn't show suggestions</div>

    <!-- HOME SEARCH -->
    <div class="test-group">
        <label>📍 HOME SEARCH</label>
        <div class="search-wrapper">
            <input type="text" id="search-home" placeholder="Type 'kak'..." oninput="searchLocation('home')" autocomplete="off">
            <div class="suggestions" id="suggestions-home"></div>
        </div>
    </div>

    <!-- TO SEARCH -->
    <div class="test-group">
        <label>📍 TO LOCATION</label>
        <div class="search-wrapper">
            <input type="text" id="search-to" placeholder="Type 'kak'..." oninput="searchLocation('to')" autocomplete="off">
            <div class="suggestions" id="suggestions-to"></div>
        </div>
    </div>

    <!-- Status -->
    <div class="status-box" id="status-box">
        <div class="row"><span>🔹 Home Search</span><span id="home-status" class="pending">⏳ Waiting...</span></div>
        <div class="row"><span>🔹 TO Search</span><span id="to-status" class="pending">⏳ Waiting...</span></div>
        <div class="row"><span>🔹 Function Called</span><span id="call-status" class="pending">⏳ Waiting...</span></div>
    </div>

    <!-- Buttons -->
    <div class="btn-group">
        <button class="btn-blue" onclick="testBoth()">🔍 Test Both</button>
        <button class="btn-purple" onclick="testHome()">🏠 Home</button>
        <button class="btn-red" onclick="testTo()">📍 TO</button>
        <button class="btn-green" onclick="checkElements()">🔎 Check</button>
        <button class="btn-gray" onclick="clearAll()">🗑️ Clear</button>
    </div>

    <!-- Console Log -->
    <div class="console-box" id="console">⏳ Waiting for input...</div>
</div>

<script>
// ============================================================
// LOCATION DATA
// ============================================================
var LOCATIONS = [
  {pin:"533001", name:"Kakinada", district:"Kakinada", state:"AP", lat:16.9550556, lng:82.2354722},
  {pin:"533406", name:"Annavaram", district:"Kakinada", state:"AP", lat:17.2830278, lng:82.4064444},
  {pin:"400001", name:"Mumbai", district:"MUMBAI", state:"MH", lat:18.9391667, lng:72.8375556},
  {pin:"530001", name:"Visakhapatnam", district:"VISAKHAPATANAM", state:"AP", lat:17.70402479, lng:83.29639357},
  {pin:"560002", name:"Bengaluru", district:"BENGALURU URBAN", state:"KA", lat:12.839909, lng:77.662968}
];

// ============================================================
// CONSOLE LOG
// ============================================================
function clog(msg, type) {
    var el = document.getElementById('console');
    var time = new Date().toLocaleTimeString();
    var colors = {ok:'ok', err:'err', info:'info', warn:'warn'};
    var color = colors[type] || 'info';
    el.innerHTML += '[' + time + '] <span class="' + color + '">' + msg + '</span>\n';
    el.scrollTop = el.scrollHeight;
    console.log(msg);
}

// ============================================================
// SEARCH FUNCTION
// ============================================================
function searchLocation(context) {
    var input = document.getElementById('search-' + context);
    var suggestions = document.getElementById('suggestions-' + context);
    
    clog('➡️ searchLocation("' + context + '") called', 'info');
    
    if(!input) {
        clog('❌ Input #search-' + context + ' NOT FOUND!', 'err');
        document.getElementById('call-status').textContent = '❌ Input missing';
        document.getElementById('call-status').className = 'fail';
        return;
    }
    if(!suggestions) {
        clog('❌ Suggestions #suggestions-' + context + ' NOT FOUND!', 'err');
        return;
    }
    
    clog('✅ Input found, suggestions found', 'ok');
    
    var query = input.value.trim();
    clog('📝 Query: "' + query + '"', 'info');
    
    if(!query) {
        suggestions.classList.remove('show');
        clog('⏹️ Query empty', 'warn');
        return;
    }
    
    // Search
    var results = [];
    var ql = query.toLowerCase();
    for(var i = 0; i < LOCATIONS.length; i++) {
        var l = LOCATIONS[i];
        if(l.name.toLowerCase().includes(ql) || l.pin.includes(query)) {
            results.push(l);
        }
        if(results.length >= 8) break;
    }
    
    clog('🔍 Found ' + results.length + ' results', 'info');
    
    if(results.length === 0) {
        suggestions.classList.remove('show');
        clog('⚠️ No results', 'warn');
        return;
    }
    
    // Build HTML
    var html = '';
    for(var j = 0; j < results.length; j++) {
        var l = results[j];
        var displayName = l.name + ', ' + l.district + ', ' + l.state + ' (' + l.pin + ')';
        var idx = displayName.toLowerCase().indexOf(ql);
        var displayHtml = displayName;
        if(idx !== -1) {
            displayHtml = displayName.substring(0, idx) + 
                          '<span class="highlight">' + 
                          displayName.substring(idx, idx + query.length) + 
                          '</span>' + 
                          displayName.substring(idx + query.length);
        }
        html += '<div class="item" onclick="selectLocation(\'' + context + '\',\'' + l.pin + '\',\'' + l.name + '\',\'' + l.state + '\')">' + displayHtml + '</div>';
    }
    
    suggestions.innerHTML = html;
    suggestions.classList.add('show');
    clog('✅ Suggestions shown for ' + context + '!', 'ok');
    
    var statusId = context === 'home' ? 'home-status' : 'to-status';
    document.getElementById(statusId).textContent = '✅ ' + results.length + ' results';
    document.getElementById(statusId).className = 'pass';
    document.getElementById('call-status').textContent = '✅ searchLocation("' + context + '") called';
    document.getElementById('call-status').className = 'pass';
}

// ============================================================
// SELECT LOCATION
// ============================================================
function selectLocation(context, pin, name, state) {
    var displayName = name + ', ' + state + ' (' + pin + ')';
    var input = document.getElementById('search-' + context);
    var suggestions = document.getElementById('suggestions-' + context);
    
    input.value = displayName;
    suggestions.classList.remove('show');
    clog('✅ Selected: ' + displayName, 'ok');
}

// ============================================================
// TEST FUNCTIONS
// ============================================================
function testHome() {
    clog('🔵 Testing Home search...', 'info');
    var input = document.getElementById('search-home');
    input.value = 'kak';
    input.focus();
    searchLocation('home');
}

function testTo() {
    clog('🟣 Testing TO search...', 'info');
    var input = document.getElementById('search-to');
    input.value = 'kak';
    input.focus();
    searchLocation('to');
}

function testBoth() {
    clog('🔵🟣 Testing BOTH searches...', 'info');
    testHome();
    setTimeout(testTo, 500);
}

function checkElements() {
    clog('🔎 Checking elements...', 'info');
    var homeInput = document.getElementById('search-home');
    var toInput = document.getElementById('search-to');
    var homeSug = document.getElementById('suggestions-home');
    var toSug = document.getElementById('suggestions-to');
    
    if(homeInput) clog('✅ Home input exists', 'ok');
    else clog('❌ Home input MISSING', 'err');
    
    if(toInput) clog('✅ TO input exists', 'ok');
    else clog('❌ TO input MISSING', 'err');
    
    if(homeSug) clog('✅ Home suggestions exists', 'ok');
    else clog('❌ Home suggestions MISSING', 'err');
    
    if(toSug) clog('✅ TO suggestions exists', 'ok');
    else clog('❌ TO suggestions MISSING', 'err');
    
    if(typeof searchLocation === 'function') {
        clog('✅ searchLocation() function exists', 'ok');
    } else {
        clog('❌ searchLocation() function MISSING!', 'err');
    }
}

function clearAll() {
    document.getElementById('search-home').value = '';
    document.getElementById('search-to').value = '';
    document.getElementById('suggestions-home').classList.remove('show');
    document.getElementById('suggestions-to').classList.remove('show');
    document.getElementById('console').innerHTML = '';
    document.getElementById('home-status').textContent = '⏳ Cleared';
    document.getElementById('home-status').className = 'pending';
    document.getElementById('to-status').textContent = '⏳ Cleared';
    document.getElementById('to-status').className = 'pending';
    document.getElementById('call-status').textContent = '⏳ Waiting...';
    document.getElementById('call-status').className = 'pending';
    clog('🗑️ Cleared all', 'warn');
}

// Close suggestions
document.addEventListener('click', function(e) {
    document.querySelectorAll('.suggestions').forEach(function(s) {
        if(!s.parentElement.contains(e.target)) {
            s.classList.remove('show');
        }
    });
});

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    clog('🚀 Search Debug initialized', 'info');
    clog('📦 ' + LOCATIONS.length + ' locations loaded', 'info');
    clog('📝 Click buttons below to test', 'info');
});
</script>
</body>
</html>
