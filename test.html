        td { padding: 6px 8px; border-bottom: 1px solid #1a1a2e; }

        // ============================================================
        // HELPER FUNCTIONS
        // ============================================================
        function getLoc(pinId) {
            if (!pinId) return null;
            const pinNum = parseInt(pinId);
            if (isNaN(pinNum)) return null;
            const exact = LOCATIONS.find(l => l.pin_id === pinNum);
            if (exact) return exact;
            // Try pincode match
            const pinStr = String(pinNum);
            if (pinStr.length >= 6) {
                const pincode = pinStr.substring(0, 6);
                const matches = LOCATIONS.filter(l => l.pincode === pincode);
                if (matches.length > 0) {
                    const exact2 = matches.find(l => l.pin_id === pinNum);
                    if (exact2) return exact2;
                    return matches[0];
                }
            }
            return null;
        }

        function getLocDisplayName(loc) {
            if (!loc) return 'Unknown';
            return loc.name + ', ' + loc.district + ', ' + loc.state + ' (' + loc.pincode + ')';
        }

        function dist(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function addResult(html) {
            const container = document.getElementById('results');
            container.innerHTML += html;
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        function formatIndianNumber(num) {
            if (num === undefined || num === null || isNaN(num)) return '0';
            return Number(num).toLocaleString('en-IN');
        }

        // ============================================================
        // TEST FUNCTIONS
        // ============================================================
        async function testLocation(searchPinId, searchName, radius) {
            const container = document.getElementById('results');
            container.innerHTML = `<div class="card"><h3>⏳ Testing ${searchName}...</h3><div class="spinner" style="display:inline-block;width:20px;height:20px;border:3px solid #2d2d3d;border-top-color:#2563eb;border-radius:50%;animation:spin 0.8s linear infinite;"></div></div>`;

            try {
                // Fetch data
                const [loadsRes, trucksRes, usersRes] = await Promise.all([
                    sb.from('active_loads').select('*').eq('status', 1),
                    sb.from('active_trucks').select('*').eq('status', 1),
                    sb.from('active_users').select('*')
                ]);

                const loads = loadsRes.data || [];
                const trucks = trucksRes.data || [];
                const users = usersRes.data || [];

                const hl = getLoc(searchPinId);
                const searchPincode = hl ? String(hl.pincode) : '';

                let html = '';
                html += `<div class="card">`;
                html += `<h3>📍 Testing: ${searchName}</h3>`;
                html += `<div class="flex">`;
                html += `<span class="info">🔍 Search PIN: ${searchPinId}</span>`;
                html += `<span class="info">📌 Pincode: ${searchPincode}</span>`;
                html += `<span class="info">📍 Location: ${hl ? getLocDisplayName(hl) : 'Not found'}</span>`;
                html += `<span class="info">📏 Radius: ${radius} KM</span>`;
                html += `</div>`;
                html += `<p class="info">📊 Found ${loads.length} loads, ${trucks.length} trucks, ${users.length} users</p>`;
                html += `</div>`;

                // ---- CHECK LOADS ----
                html += `<div class="card"><h3>📦 Loads (${loads.length})</h3>`;
                if (loads.length === 0) {
                    html += `<p class="error">❌ No loads found with status = 1</p>`;
                } else {
                    html += `<table>
                        <tr><th>ID</th><th>Material</th><th>pickup_pin</th><th>Location</th><th>Distance</th><th>Status</th></tr>`;
                    let matchedCount = 0;
                    loads.forEach(l => {
                        const fl = getLoc(l.pickup_pin);
                        let distance = 'N/A';
                        let inRadius = false;
                        let locationName = 'Unknown';

                        if (fl) {
                            locationName = getLocDisplayName(fl);
                            distance = dist(hl.lat, hl.lng, fl.lat, fl.lng);
                            inRadius = distance <= radius;
                            if (inRadius) matchedCount++;
                        } else {
                            // Try pincode match
                            const pinStr = String(l.pickup_pin);
                            if (pinStr.length >= 6) {
                                const itemPincode = pinStr.substring(0, 6);
                                if (itemPincode === searchPincode) {
                                    locationName = `Pincode match: ${itemPincode}`;
                                    inRadius = true;
                                    matchedCount++;
                                }
                            }
                        }

                        const status = inRadius ? '✅ IN RADIUS' : (fl ? '❌ Outside' : '⚠️ No location');
                        const color = inRadius ? 'color:#4ade80;' : (fl ? 'color:#f87171;' : 'color:#fbbf24;');
                        const expires = l.expires_at ? new Date(l.expires_at) : null;
                        const isExpired = expires ? expires < new Date() : false;

                        html += `<tr style="${color}">
                            <td>${l.id}</td>
                            <td>${l.material || 'N/A'}</td>
                            <td>${l.pickup_pin}</td>
                            <td>${locationName}</td>
                            <td>${typeof distance === 'number' ? distance.toFixed(1) + ' KM' : distance}</td>
                            <td>${status} ${isExpired ? '🔴 EXPIRED' : ''}</td>
                        </tr>`;
                    });
                    html += `<tr style="background:#2563eb33;"><td colspan="6"><strong>Matched: ${matchedCount} / ${loads.length} loads</strong></td></tr>`;
                    html += `</table>`;
                }
                html += `</div>`;

                // ---- CHECK TRUCKS ----
                html += `<div class="card"><h3>🚛 Trucks (${trucks.length})</h3>`;
                if (trucks.length === 0) {
                    html += `<p class="error">❌ No trucks found with status = 1</p>`;
                } else {
                    html += `<table>
                        <tr><th>ID</th><th>Truck No</th><th>location_pin</th><th>Location</th><th>Distance</th><th>Status</th></tr>`;
                    let matchedCount = 0;
                    trucks.forEach(t => {
                        const fl = getLoc(t.location_pin);
                        let distance = 'N/A';
                        let inRadius = false;
                        let locationName = 'Unknown';

                        if (fl) {
                            locationName = getLocDisplayName(fl);
                            distance = dist(hl.lat, hl.lng, fl.lat, fl.lng);
                            inRadius = distance <= radius;
                            if (inRadius) matchedCount++;
                        } else {
                            const pinStr = String(t.location_pin);
                            if (pinStr.length >= 6) {
                                const itemPincode = pinStr.substring(0, 6);
                                if (itemPincode === searchPincode) {
                                    locationName = `Pincode match: ${itemPincode}`;
                                    inRadius = true;
                                    matchedCount++;
                                }
                            }
                        }

                        const status = inRadius ? '✅ IN RADIUS' : (fl ? '❌ Outside' : '⚠️ No location');
                        const color = inRadius ? 'color:#4ade80;' : (fl ? 'color:#f87171;' : 'color:#fbbf24;');

                        html += `<tr style="${color}">
                            <td>${t.id}</td>
                            <td>${t.truck_no || 'N/A'}</td>
                            <td>${t.location_pin}</td>
                            <td>${locationName}</td>
                            <td>${typeof distance === 'number' ? distance.toFixed(1) + ' KM' : distance}</td>
                            <td>${status}</td>
                        </tr>`;
                    });
                    html += `<tr style="background:#2563eb33;"><td colspan="6"><strong>Matched: ${matchedCount} / ${trucks.length} trucks</strong></td></tr>`;
                    html += `</table>`;
                }
                html += `</div>`;

                // ---- CHECK AGENTS ----
                html += `<div class="card"><h3>🤝 Agents (${users.filter(u => { let ut = u.user_type || []; if (!Array.isArray(ut) && typeof ut === 'number') ut = [ut]; return ut.includes(3); }).length})</h3>`;
                const agents = users.filter(u => {
                    let ut = u.user_type || [];
                    if (!Array.isArray(ut) && typeof ut === 'number') ut = [ut];
                    return ut.includes(3);
                });
                if (agents.length === 0) {
                    html += `<p class="info">No agents found</p>`;
                } else {
                    html += `<table>
                        <tr><th>Mobile</th><th>Name</th><th>location</th><th>Location</th><th>Distance</th><th>Status</th></tr>`;
                    let matchedCount = 0;
                    agents.forEach(a => {
                        const fl = getLoc(a.location);
                        let distance = 'N/A';
                        let inRadius = false;
                        let locationName = a.location ? 'Unknown' : 'Multiple Locations';

                        if (!a.location) {
                            inRadius = true;
                            matchedCount++;
                            locationName = '🌍 Multiple Locations';
                        } else if (fl) {
                            locationName = getLocDisplayName(fl);
                            distance = dist(hl.lat, hl.lng, fl.lat, fl.lng);
                            inRadius = distance <= radius;
                            if (inRadius) matchedCount++;
                        }

                        const status = inRadius ? '✅ IN RADIUS' : (fl ? '❌ Outside' : '🌍 Multiple');
                        const color = inRadius ? 'color:#4ade80;' : (fl ? 'color:#f87171;' : 'color:#fbbf24;');

                        html += `<tr style="${color}">
                            <td>${a.mobile}</td>
                            <td>${a.name || a.company_name || 'Unknown'}</td>
                            <td>${a.location || 'null'}</td>
                            <td>${locationName}</td>
                            <td>${typeof distance === 'number' ? distance.toFixed(1) + ' KM' : distance}</td>
                            <td>${status}</td>
                        </tr>`;
                    });
                    html += `<tr style="background:#2563eb33;"><td colspan="6"><strong>Matched: ${matchedCount} / ${agents.length} agents</strong></td></tr>`;
                    html += `</table>`;
                }
                html += `</div>`;

                container.innerHTML = html;

            } catch (error) {
                container.innerHTML = `<div class="card"><h3 class="error">❌ Error</h3><p>${error.message}</p></div>`;
                console.error(error);
            }
        }

        async function showAllData() {
            const container = document.getElementById('results');
            container.innerHTML = `<div class="card"><h3>⏳ Loading all data...</h3></div>`;

            try {
                const [loadsRes, trucksRes, usersRes] = await Promise.all([
                    sb.from('active_loads').select('*').eq('status', 1),
                    sb.from('active_trucks').select('*').eq('status', 1),
                    sb.from('active_users').select('*')
                ]);

                const loads = loadsRes.data || [];
                const trucks = trucksRes.data || [];
                const users = usersRes.data || [];

                let html = '';
                html += `<div class="card"><h3>📊 All Data Summary</h3>`;
                html += `<p class="success">✅ Loads: ${loads.length}</p>`;
                html += `<p class="success">✅ Trucks: ${trucks.length}</p>`;
                html += `<p class="success">✅ Users: ${users.length}</p>`;
                html += `</div>`;

                // Loads
                html += `<div class="card"><h3>📦 All Loads</h3>`;
                if (loads.length === 0) {
                    html += `<p class="error">❌ No loads found</p>`;
                } else {
                    html += `<table>
                        <tr><th>ID</th><th>Material</th><th>pickup_pin</th><th>drop_pin</th><th>expires_at</th><th>status</th></tr>`;
                    loads.forEach(l => {
                        const isExpired = l.expires_at ? new Date(l.expires_at) < new Date() : false;
                        html += `<tr style="${isExpired ? 'color:#f87171;' : ''}">
                            <td>${l.id}</td>
                            <td>${l.material || 'N/A'}</td>
                            <td>${l.pickup_pin}</td>
                            <td>${l.drop_pin}</td>
                            <td>${l.expires_at ? new Date(l.expires_at).toLocaleDateString() : 'N/A'}</td>
                            <td>${isExpired ? '🔴 EXPIRED' : '✅ Active'}</td>
                        </tr>`;
                    });
                    html += `</table>`;
                }
                html += `</div>`;

                // Trucks
                html += `<div class="card"><h3>🚛 All Trucks</h3>`;
                if (trucks.length === 0) {
                    html += `<p class="error">❌ No trucks found</p>`;
                } else {
                    html += `<table>
                        <tr><th>ID</th><th>Truck No</th><th>location_pin</th><th>expires_at</th><th>status</th></tr>`;
                    trucks.forEach(t => {
                        const isExpired = t.expires_at ? new Date(t.expires_at) < new Date() : false;
                        html += `<tr style="${isExpired ? 'color:#f87171;' : ''}">
                            <td>${t.id}</td>
                            <td>${t.truck_no || 'N/A'}</td>
                            <td>${t.location_pin}</td>
                            <td>${t.expires_at ? new Date(t.expires_at).toLocaleDateString() : 'N/A'}</td>
                            <td>${isExpired ? '🔴 EXPIRED' : '✅ Active'}</td>
                        </tr>`;
                    });
                    html += `</table>`;
                }
                html += `</div>`;

                // Agents
                const agents = users.filter(u => {
                    let ut = u.user_type || [];
                    if (!Array.isArray(ut) && typeof ut === 'number') ut = [ut];
                    return ut.includes(3);
                });
                html += `<div class="card"><h3>🤝 Agents (${agents.length})</h3>`;
                if (agents.length === 0) {
                    html += `<p class="info">No agents found</p>`;
                } else {
                    html += `<table>
                        <tr><th>Mobile</th><th>Name</th><th>Company</th><th>location</th></tr>`;
                    agents.forEach(a => {
                        const loc = getLoc(a.location);
                        html += `<tr>
                            <td>${a.mobile}</td>
                            <td>${a.name || 'Unknown'}</td>
                            <td>${a.company_name || ''}</td>
                            <td>${loc ? getLocDisplayName(loc) : (a.location ? 'Unknown' : 'Multiple Locations')}</td>
                        </tr>`;
                    });
                    html += `</table>`;
                }
                html += `</div>`;

                container.innerHTML = html;

            } catch (error) {
                container.innerHTML = `<div class="card"><h3 class="error">❌ Error</h3><p>${error.message}</p></div>`;
                console.error(error);
            }
        }

        // ============================================================
        // AUTO-RUN on load
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // Show all data on load
            showAllData();
        });
