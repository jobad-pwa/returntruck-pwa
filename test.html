<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ReturnTruck - Install Test Suite</title>
<style>
/* Minimal reset for testing */
body{font-family:system-ui,sans-serif;background:#f3f4f6;margin:0;padding:16px;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{max-width:420px;width:100%;background:#fff;border-radius:24px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.1);display:flex;flex-direction:column;position:relative;min-height:600px}
h1{color:#2563eb;text-align:center}
.subtitle{color:#64748b;text-align:center;margin-bottom:20px;font-size:14px}

/* BANNER */
.install-banner{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;padding:12px 16px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.install-banner .btn-install{background:#fff;color:#2563eb;border:none;padding:6px 16px;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer}
.install-banner .btn-close{background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;padding:0 8px}
.install-banner.hidden{display:none !important}

/* LOG DASHBOARD */
.log-box{background:#1e293b;border-radius:12px;padding:12px;margin-top:12px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;max-height:400px}
.log-entry{font-size:11px;color:#94a3b8;border-bottom:1px solid #334155;padding:4px 0;font-family:monospace}
.log-entry .time{color:#64748b;margin-right:8px}
.log-entry.success{color:#34d399}
.log-entry.warning{color:#fbbf24}
.log-entry.error{color:#f87171}
.log-entry.info{color:#60a5fa}
.action-btn{background:#2563eb;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;margin-top:8px;width:100%}
.clear-btn{background:#475569;color:#fff;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;margin-bottom:8px}
</style>
</head>
<body>

<div class="card">
    <h1>🚚 Install Test Suite</h1>
    <div class="subtitle">Real-time logic logs displayed below</div>

    <!-- THE INSTALL BANNER -->
    <div class="install-banner hidden" id="install-banner">
        <span>📲 Install ReturnTruck app</span>
        <div>
            <button class="btn-install" id="install-btn" onclick="installApp()">Install</button>
            <button class="btn-close" onclick="dismissInstallBanner()">✕</button>
        </div>
    </div>

    <button class="clear-btn" onclick="clearLogs()">Clear Logs</button>

    <!-- LIVE LOG DISPLAY -->
    <div class="log-box" id="log-container"></div>

    <div style="margin-top:12px;display:flex;gap:8px">
        <button class="action-btn" onclick="simulateLogin()">Simulate Login</button>
        <button class="action-btn" style="background:#dc2626" onclick="simulateLogout()">Simulate Logout</button>
    </div>
    <div style="margin-top:6px;font-size:11px;color:#94a3b8;text-align:center">* Simulates currentUser state changes</div>
</div>

<script>
// ============================================================
// LOGGING ENGINE
// ============================================================
const logContainer = document.getElementById('log-container');

function addLog(message, type = 'info') {
    const time = new Date().toLocaleTimeString();
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    entry.innerHTML = `<span class="time">[${time}]</span> ${message}`;
    logContainer.appendChild(entry);
    // Auto-scroll to bottom
    logContainer.scrollTop = logContainer.scrollHeight;
    // Also log to browser console for F12 backup
    console.log(`[TEST] ${message}`);
}

function clearLogs() {
    logContainer.innerHTML = '';
    addLog('🧹 Logs cleared.');
}

// ============================================================
// STATE VARIABLES
// ============================================================
let deferredPrompt = null;
// We simulate app state variables here
let mockCurrentUser = null; 
let mockIsGuest = false;

const banner = document.getElementById('install-banner');
const installBtn = document.getElementById('install-btn');

// ============================================================
// 1. BEFOREINSTALLPROMPT EVENT (Mobile Install Check)
// ============================================================
window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    addLog('✅ beforeinstallprompt EVENT FIRED! App is eligible for installation.', 'success');
    addLog(`ℹ️ User Agent: ${navigator.userAgent}`, 'info');
    
    // Since the event fired, we know it's installable.
    installBtn.textContent = '📲 Install Now';
    installBtn.disabled = false;
    
    // Immediately check our main logic
    checkBannerLogic();
});

// ============================================================
// 2. APP ALREADY INSTALLED CHECK (Standalone Mode)
// ============================================================
function checkStandalone() {
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
    if (isStandalone) {
        addLog('📱 APP IS ALREADY INSTALLED (Standalone Mode detected). Banner should hide.', 'success');
    } else {
        addLog('🌐 Running in Browser (Not installed).', 'info');
    }
    return isStandalone;
}

// ============================================================
// 3. LOCAL STORAGE 'DISMISSED' MEMORY CHECK
// ============================================================
function checkLocalStorageDismissed() {
    const dismissed = localStorage.getItem('rt_install_dismissed');
    if (dismissed === 'true') {
        addLog('💾 LocalStorage: User dismissed banner previously (rt_install_dismissed = true).', 'warning');
        return true;
    } else {
        addLog('💾 LocalStorage: No dismissal record found (rt_install_dismissed is null).', 'info');
        return false;
    }
}

// ============================================================
// 4. LOGIN / LOGOUT STATE SIMULATION
// ============================================================
function simulateLogin() {
    mockCurrentUser = { mobile: '9999999999' };
    mockIsGuest = false;
    addLog('🔐 Simulated: User Logged In.', 'success');
    checkBannerLogic();
}

function simulateLogout() {
    mockCurrentUser = null;
    mockIsGuest = false;
    // According to your request, logging out should delete the dismissed flag
    localStorage.removeItem('rt_install_dismissed');
    addLog('🚪 Simulated: User Logged Out. Wiped rt_install_dismissed from memory.', 'error');
    checkBannerLogic();
}

// ============================================================
// 5. MAIN LOGIC: THE DECISION ENGINE
// ============================================================
function checkBannerLogic() {
    addLog('--- Running Decision Logic ---', 'info');
    
    // Step A: Check if installed
    if (checkStandalone()) {
        banner.classList.add('hidden');
        banner.style.display = 'none';
        addLog('🛑 DECISION: Banner HIDDEN (App is installed).', 'error');
        return;
    }

    // Step B: Check if logged in or guest
    const isLoggedIn = mockCurrentUser !== null || mockIsGuest;
    if (!isLoggedIn) {
        // FORCE RULE: If not logged in, we MUST delete the flag and show the banner.
        localStorage.removeItem('rt_install_dismissed');
        addLog('🛠️ DECISION: User is NOT logged in. Deleted memory flag.', 'info');
        banner.classList.remove('hidden');
        banner.style.display = 'flex';
        addLog('✅ DECISION: Banner SHOWING (Logged out state forces display).', 'success');
        return;
    }

    // Step C: Check if user dismissed it previously (Only for logged-in users)
    if (checkLocalStorageDismissed()) {
        banner.classList.add('hidden');
        banner.style.display = 'none';
        addLog('🛑 DECISION: Banner HIDDEN (Logged in user previously closed it).', 'warning');
        return;
    }

    // Step D: Show banner by default (Not installed, not dismissed, logged in)
    banner.classList.remove('hidden');
    banner.style.display = 'flex';
    addLog('✅ DECISION: Banner SHOWING (Not installed, not dismissed, logged in).', 'success');
}

// ============================================================
// 6. USER ACTION: CLOSE (X) BUTTON
// ============================================================
function dismissInstallBanner() {
    banner.classList.add('hidden');
    banner.style.display = 'none';
    localStorage.setItem('rt_install_dismissed', 'true');
    addLog('✕ User clicked CLOSE. Saved rt_install_dismissed = true to memory.', 'warning');
    checkBannerLogic(); // Re-run logic to confirm it applied
}

// ============================================================
// 7. USER ACTION: INSTALL BUTTON
// ============================================================
function installApp() {
    if (deferredPrompt) {
        addLog('⚡ User clicked INSTALL. Triggering native prompt...', 'info');
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(result) {
            if (result.outcome === 'accepted') {
                addLog('✅ User ACCEPTED installation!', 'success');
                banner.classList.add('hidden');
                banner.style.display = 'none';
                localStorage.setItem('rt_install_dismissed', 'true');
                checkBannerLogic();
            } else {
                addLog('⛔ User DECLINED installation.', 'error');
            }
            deferredPrompt = null;
        });
    } else {
        addLog('❌ Install clicked, but no prompt available. (Desktop or non-Chrome browser).', 'error');
    }
}

// ============================================================
// 8. INITIALIZATION (Run on Page Load)
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    addLog('🚀 Test Suite Initialized.');
    addLog(`ℹ️ Current URL: ${window.location.href}`);
    addLog(`ℹ️ User Agent: ${navigator.userAgent}`);
    checkBannerLogic();
});
</script>
</body>
</html>
