<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ReturnTruck - Edit Profile</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#f3f4f6;margin:0;padding:16px;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{max-width:420px;width:100%;background:#fff;border-radius:24px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.1);display:flex;flex-direction:column;height:95vh;max-height:800px;position:relative;overflow:hidden}
.hidden-page{display:none !important}.hidden{display:none !important}
.header-fixed{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid #f1f5f9;background:#fff;z-index:10;width:100%;min-height:50px}
.logo{font-size:22px;font-weight:900;color:#2563eb;cursor:pointer;display:flex;align-items:center;gap:6px;text-decoration:none}
.logo-icon{font-size:28px;line-height:1}.logo-text{font-size:22px;font-weight:900;color:#2563eb;letter-spacing:-0.5px}
.back-btn{background:transparent;border:none;font-size:14px;font-weight:600;color:#64748b;cursor:pointer;padding:4px 8px}.back-btn:hover{color:#2563eb}
.scroll-body{overflow-y:auto;padding:8px 0;-webkit-overflow-scrolling:touch;display:block;width:100%;flex:1}
.scroll-body::-webkit-scrollbar{width:4px}.scroll-body::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}
.nav-fixed{flex-shrink:0;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #e2e8f0;background:#fff;position:relative;z-index:10;min-height:65px;width:100%;padding-bottom:5px;margin-top:auto}
.nav-item{display:flex;flex-direction:column;align-items:center;color:#94a3b8;font-size:9px;font-weight:600;cursor:pointer;border:none;background:transparent;padding:6px 12px;position:relative;z-index:2}
.nav-item.active{color:#2563eb}.nav-item .icon{font-size:22px;margin-bottom:2px}.nav-item .label{font-size:9px;text-transform:uppercase;letter-spacing:.05em}
.profile-section{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:12px}
.profile-section .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.profile-section .section-title{font-size:14px;font-weight:700;color:#1e293b}
.profile-section .section-badge{font-size:9px;padding:2px 10px;border-radius:12px;font-weight:700}
.section-badge.active{background:#dcfce7;color:#166534}
.section-badge.optional{background:#e2e8f0;color:#64748b}
.section-btn{padding:8px 16px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:12px}
.section-btn:hover{background:#1d4ed8}
.section-btn.secondary{background:#e2e8f0;color:#1e293b}
.section-btn.secondary:hover{background:#cbd5e1}
.section-btn.danger{background:#dc2626;color:#fff}
.section-btn.danger:hover{background:#b91c1c}
.section-btn.success{background:#16a34a;color:#fff}
.section-btn.success:hover{background:#15803d}
.form-control{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;background:#fff;outline:none}
.form-control:focus{border-color:#2563eb}
.form-label{font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;display:block;margin-bottom:4px}
.btn-primary{width:100%;padding:14px;background:#2563eb;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:10px}
.btn-primary:hover{background:#1d4ed8}
.btn-primary.success{background:#16a34a}.btn-primary.success:hover{background:#15803d}
.vehicle-item{display:flex;align-items:center;justify-content:space-between;background:#f8fafc;padding:8px 12px;border-radius:6px;margin-bottom:4px;border:1px solid #e2e8f0}
.vehicle-item .vnumber{font-weight:600;font-size:13px;color:#0f172a;flex:1}
.vehicle-item .vdetails{font-size:11px;color:#64748b;flex:1}
.vehicle-item .actions{display:flex;gap:4px}
.vehicle-item .actions button{padding:3px 8px;font-size:9px;border:none;border-radius:4px;font-weight:600;cursor:pointer}
.vehicle-item .actions .edit-btn{background:#dbeafe;color:#1e40af}

.vehicle-item .actions .delete-btn{background:#fef2f2;color:#991b1b}

.route-tag{background:#e2e8f0;padding:4px 10px;border-radius:6px;font-size:12px;display:inline-block;margin:2px}
.route-tag .remove{color:#dc2626;cursor:pointer;margin-left:6px;font-weight:700}

.user-type-checkbox{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}

.route-input-row{display:flex;gap:6px;margin-bottom:8px}
.route-input-row input{flex:2}
.route-input-row button{flex-shrink:0}
.vehicle-suggest-dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #e2e8f0;border-radius:8px;margin-top:4px;max-height:150px;overflow-y:auto;z-index:50;display:none}
.vehicle-suggest-dropdown.show{display:block}
.vehicle-suggest-dropdown .item{padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f1f5f9}
.vehicle-suggest-dropdown .item:hover{background:#f1f5f9}
.vehicle-suggest-dropdown .item .sub{font-size:10px;color:#94a3b8}
.vehicle-suggest-dropdown .item .add-new{color:#2563eb;font-weight:600}
.vehicle-number-input{font-family:monospace;letter-spacing:0.5px;text-transform:uppercase}
.search-wrapper{position:relative;width:100%}
.search-wrapper .suggestions{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin-top:4px;max-height:180px;overflow-y:auto;z-index:999;display:none;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.search-wrapper .suggestions.show{display:block}

.header-right{display:flex;align-items:center;gap:8px;position:relative}
.profile-dropdown{position:absolute;top:45px;right:0;background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:160px;z-index:100;display:none}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

<script>
// ============================================================
// CONFIG
// ============================================================
const SB_URL = 'https://ghjoffovatgvhzxlupef.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdoam9mZm92YXRndmh6eGx1cGVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MDM4MjQsImV4cCI6MjEwMDk3OTgyNH0.bGDIHZDcLdZqJl9u5qhDm5mlGfWR3fp1sxrpwCtsDsg';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

// ============================================================
// STATE
// ============================================================
let user = null, guest = false;
let vehicles = [], routes = [];
let vehicleDataMap = {};
let editingVehicleNumber = null;

// ============================================================
// LOCATIONS
// ============================================================
const LOCATIONS = [
  {pin_id:50000101, pincode:"500001", name:"Hyderabad G.P.O.", district:"HYDERABAD", state:"TG", lat:17.387993, lng:78.47652},
  {pin_id:50004501, pincode:"500045", name:"Yousufguda", district:"HYDERABAD", state:"TG", lat:17.441504, lng:78.424536},
  {pin_id:50004902, pincode:"500049", name:"Miyapur", district:"MEDCHAL MALKAJGIRI", state:"TG", lat:17.49253338, lng:78.35148793},
  {pin_id:53300104, pincode:"533001", name:"Kakinada", district:"Kakinada", state:"AP", lat:16.9550556, lng:82.2354722},
  {pin_id:52400103, pincode:"524001", name:"Nellore", district:"SPSR NELLORE", state:"AP", lat:14.451895, lng:79.980856},
  {pin_id:52420106, pincode:"524201", name:"Kavali", district:"SPSR NELLORE", state:"AP", lat:14.91658, lng:79.993121}
];

function getLoc(pinId) {
  if (!pinId) return null;
  const pinNum = parseInt(pinId);
  if (isNaN(pinNum)) return null;
  return LOCATIONS.find(l => l.pin_id === pinNum) || null;
}
function getLocDisplayName(loc) {
  if (!loc) return 'Unknown';
  return loc.name + ', ' + loc.district + ', ' + loc.state + ' (' + loc.pincode + ')';
}

// ============================================================
// UTILITY
// ============================================================
function $(id) { return document.getElementById(id); }
function toast(msg) { alert(msg); }
function selectInputText(input) { input.select(); input.classList.add('selected'); }

// ============================================================
// SEARCH LOCATION
// ============================================================
function searchLocation(ctx) {
  const inp = $('search-' + ctx);
  const sug = $('suggestions-' + ctx);
  if (!inp || !sug) return;
  const q = inp.value.trim();
  if (!q) { sug.classList.remove('show'); sug.innerHTML = ''; return; }
  const res = LOCATIONS.filter(l =>
    l.name.toLowerCase().includes(q.toLowerCase()) ||
    l.pincode.includes(q) ||
    l.district.toLowerCase().includes(q.toLowerCase()) ||
    l.state.toLowerCase().includes(q.toLowerCase()) ||
    String(l.pin_id).includes(q)
  ).slice(0, 10);
  if (!res.length) { sug.classList.remove('show'); sug.innerHTML = ''; return; }
  let html = '';
  res.forEach(l => {
    const dn = getLocDisplayName(l);
    const idx = dn.toLowerCase().indexOf(q.toLowerCase());
    let dh = dn;
    if (idx !== -1) dh = dn.substring(0, idx) + '<span class="highlight">' + dn.substring(idx, idx + q.length) + '</span>' + dn.substring(idx + q.length);
    html += '<div class="item" data-ctx="' + ctx + '" data-pinid="' + l.pin_id + '">' + dh + '</div>';
  });
  sug.innerHTML = html;
  sug.classList.add('show');
}

document.addEventListener('click', function(e) {
  const item = e.target.closest('.item');
  if (item) {
    const ctx = item.dataset.ctx;
    const pinId = item.dataset.pinid;
    if (ctx && pinId) selectLoc(ctx, pinId);
  }
  document.querySelectorAll('.suggestions').forEach(s => {
    const parent = s.parentElement;
    if (parent && !parent.contains(e.target)) { s.classList.remove('show'); s.innerHTML = ''; }
  });
});

function selectLoc(ctx, pinId) {
  const l = getLoc(pinId);
  if (!l) return;
  const dn = getLocDisplayName(l);
  const inp = $('search-' + ctx);
  if (inp) { inp.value = dn; setTimeout(() => { inp.select(); inp.classList.add('selected'); }, 100); }
  let hid = null;
  if (ctx === 'edit-location') hid = 'edit-location-hidden';
  else if (ctx === 'edit-route') hid = 'edit-route-hidden';
  if (hid && $(hid)) $(hid).value = pinId;
  const sug = $('suggestions-' + ctx);
  if (sug) { sug.classList.remove('show'); sug.innerHTML = ''; }
}

// ============================================================
// VEHICLE FUNCTIONS
// ============================================================
function isValidVehicleNumber(number) {
  return /^[A-Za-z0-9]{9,11}$/.test(number);
}

function searchVehicles(query) {
  const dropdown = $('vehicle-suggest-dropdown');
  const q = query.trim().toUpperCase();
  if (!q || q.length < 2) { dropdown.classList.remove('show'); return; }
  
  sb.from('active_vehicles').select('*').ilike('vehicle_number', '%' + q + '%').limit(10)
    .then(result => {
      if (result.error) { console.error(result.error); return; }
      const vlist = result.data || [];
      if (!vlist.length) {
        dropdown.innerHTML = '<div class="item add-new" onclick="openNewVehicleRegistration(\'' + q + '\')">➕ Register New Vehicle "' + q + '"</div>';
        dropdown.classList.add('show');
        return;
      }
      let html = '';
      vlist.forEach(v => {
        const dims = v.dimensions ? v.dimensions.join('×') : 'N/A';
        html += '<div class="item" onclick="selectVehicleFromSuggestion(\'' + v.id + '\',\'' + v.vehicle_number + '\',\'' + v.vehicle_type + '\',\'' + dims + '\')">' +
          v.vehicle_number + ' <span class="sub">' + v.vehicle_type + ' • ' + dims + 'ft</span>' +
          '</div>';
      });
      html += '<div class="item add-new" onclick="openNewVehicleRegistration(\'' + q + '\')">➕ Register New Vehicle "' + q + '"</div>';
      dropdown.innerHTML = html;
      dropdown.classList.add('show');
    }).catch(() => { dropdown.classList.remove('show'); });
}

function selectVehicleFromSuggestion(id, number, type, dims) {
  if (!vehicles.includes(number)) {
    vehicles.push(number);
    vehicleDataMap[number] = { id: id, vehicle_number: number, vehicle_type: type, dimensions: dims };
    renderVehicles();
    $('edit-vehicle-input').value = '';
    $('vehicle-suggest-dropdown').classList.remove('show');
    toast('✅ Vehicle "' + number + '" added to your list');
    // Auto-save after adding
    autoSaveVehicles();
  } else {
    toast('Vehicle already in your list');
  }
}

function openNewVehicleRegistration(number) {
  $('vehicle-suggest-dropdown').classList.remove('show');
  $('modal-vehicle-title').textContent = '📝 Register New Vehicle';
  $('modal-vehicle-number').textContent = 'Vehicle Number: ' + number;
  $('modal-vehicle-id').value = '';
  $('modal-vehicle-type').value = '';
  $('modal-length').value = '40';
  $('modal-width').value = '8.2';
  $('modal-height').value = '8';
  $('modal-max-weight').value = '';
  $('modal-description').value = '';
  document.querySelector('input[name="modal-odc"][value="true"]').checked = true;
  editingVehicleNumber = number;
  $('vehicle-modal').classList.add('show');
}

function openVehicleEdit(number) {
  const data = vehicleDataMap[number];
  if (!data) {
    sb.from('active_vehicles').select('*').eq('vehicle_number', number).single()
      .then(res => {
        if (res.data) {
          populateVehicleModal(res.data, 'edit');
        }
      });
    return;
  }
  sb.from('active_vehicles').select('*').eq('id', data.id).single()
    .then(res => {
      if (res.data) {
        populateVehicleModal(res.data, 'edit');
      }
    });
}

function populateVehicleModal(data, mode) {
  $('modal-vehicle-title').textContent = mode === 'edit' ? '✏️ Edit Vehicle' : '📝 Register New Vehicle';
  $('modal-vehicle-number').textContent = 'Vehicle Number: ' + data.vehicle_number;
  $('modal-vehicle-id').value = data.id || '';
  $('modal-vehicle-type').value = data.vehicle_type || '';
  if (data.dimensions && data.dimensions.length >= 3) {
    $('modal-length').value = data.dimensions[0] || '40';
    $('modal-width').value = data.dimensions[1] || '8.2';
    $('modal-height').value = data.dimensions[2] || '8';
  }
  $('modal-max-weight').value = data.max_weight || '';
  $('modal-description').value = data.description || '';
  document.querySelector('input[name="modal-odc"][value="' + (data.odc_allowed ? 'true' : 'false') + '"]').checked = true;
  editingVehicleNumber = data.vehicle_number;
  $('vehicle-modal').classList.add('show');
}

function saveVehicleModal() {
  const number = editingVehicleNumber;
  if (!number) { toast('No vehicle number'); return; }
  const vehicleType = $('modal-vehicle-type').value;
  if (!vehicleType) { toast('Please select a vehicle type'); return; }
  
  const data = {
    vehicle_number: number,
    vehicle_type: vehicleType,
    dimensions: [
      parseFloat($('modal-length').value) || 0,
      parseFloat($('modal-width').value) || 0,
      parseFloat($('modal-height').value) || 0
    ],
    max_weight: parseFloat($('modal-max-weight').value) || 0,
    description: $('modal-description').value.trim() || null,
    odc_allowed: document.querySelector('input[name="modal-odc"]:checked').value === 'true',
    modified_by: user ? user.mobile : 'guest',
    latest_update_at: new Date().toISOString()
  };
  
  const vehicleId = $('modal-vehicle-id').value;
  
  if (vehicleId) {
    // UPDATE existing vehicle
    sb.from('active_vehicles').update(data).eq('id', vehicleId)
      .then(result => {
        if (result.error) { alert('Error: ' + result.error.message); return; }
        if (!vehicles.includes(number)) {
          vehicles.push(number);
        }
        vehicleDataMap[number] = { id: vehicleId, ...data };
        renderVehicles();
        closeVehicleModal();
        autoSaveVehicles();
        toast('✅ Vehicle "' + number + '" updated successfully!');
      });
  } else {
    // INSERT new vehicle
    sb.from('active_vehicles').select('id').eq('vehicle_number', number).single()
      .then(checkRes => {
        if (checkRes.data) {
          alert('Vehicle "' + number + '" already exists in the system!');
          return;
        }
        sb.from('active_vehicles').insert(data).then(insertRes => {
          if (insertRes.error) { alert('Error: ' + insertRes.error.message); return; }
          if (!vehicles.includes(number)) {
            vehicles.push(number);
            vehicleDataMap[number] = { id: insertRes.data[0].id, ...data };
            renderVehicles();
          }
          closeVehicleModal();
          autoSaveVehicles();
          toast('✅ Vehicle "' + number + '" registered successfully!');
        });
      });
  }
}

function deleteVehicleFromModal() {
  const number = editingVehicleNumber;
  const vehicleId = $('modal-vehicle-id').value;
  if (!vehicleId) { toast('Cannot delete - vehicle not saved'); return; }
  if (!confirm('Delete vehicle "' + number + '" permanently?')) return;
  
  sb.from('active_vehicles').delete().eq('id', vehicleId)
    .then(result => {
      if (result.error) { alert('Error: ' + result.error.message); return; }
      vehicles = vehicles.filter(v => v !== number);
      delete vehicleDataMap[number];
      renderVehicles();
      closeVehicleModal();
      autoSaveVehicles();
      toast('✅ Vehicle "' + number + '" deleted');
    });
}

function closeVehicleModal() {
  $('vehicle-modal').classList.remove('show');
  editingVehicleNumber = null;
}

function addSelectedVehicle() {
  const input = $('edit-vehicle-input');
  const val = input.value.trim().toUpperCase();
  if (!val) { toast('Please enter a vehicle number'); return; }
  if (!isValidVehicleNumber(val)) { alert('Vehicle number must be 9-11 characters'); return; }
  if (vehicles.includes(val)) { toast('Already in your list'); return; }
  
  sb.from('active_vehicles').select('*').eq('vehicle_number', val).single()
    .then(res => {
      if (res.data) {
        vehicles.push(val);
        const dims = res.data.dimensions ? res.data.dimensions.join('×') : 'N/A';
        vehicleDataMap[val] = { id: res.data.id, ...res.data };
        renderVehicles();
        input.value = '';
        autoSaveVehicles();
        toast('✅ Vehicle "' + val + '" added');
      } else {
        openNewVehicleRegistration(val);
      }
    }).catch(() => {
      openNewVehicleRegistration(val);
    });
}

function removeVehicle(v) {
  if (!confirm('Remove vehicle "' + v + '" from your list?')) return;
  vehicles = vehicles.filter(x => x !== v);
  delete vehicleDataMap[v];
  renderVehicles();
  autoSaveVehicles();
}

function renderVehicles() {
  const container = $('edit-vehicles-list');
  if (!vehicles.length) { container.innerHTML = '<span style="color:#94a3b8;font-size:12px">No vehicles added</span>'; return; }
  container.innerHTML = vehicles.map(v => {
    const data = vehicleDataMap[v] || { vehicle_type: 'Unknown', dimensions: 'N/A' };
    const dims = data.dimensions || 'N/A';
    return '<div class="vehicle-item">' +
      '<span class="vnumber">' + v + '</span>' +
      '<span class="vdetails">' + (data.vehicle_type || 'Unknown') + ' • ' + dims + 'ft</span>' +
      '<div class="actions">' +
        '<button class="edit-btn" onclick="openVehicleEdit(\'' + v + '\')">✏️ Edit</button>' +
        '<button class="delete-btn" onclick="removeVehicle(\'' + v + '\')">🗑️</button>' +
      '</div>' +
      '</div>';
  }).join('');
}

// ============================================================
// AUTO-SAVE VEHICLES TO DATABASE
// ============================================================
function autoSaveVehicles() {
  if (!user || !user.mobile) return;
  
  const mobileNum = parseInt(user.mobile);
  const vehicleArray = vehicles.length > 0 ? vehicles : null;
  
  sb.from('active_users')
    .update({ vehicle_no: vehicleArray })
    .eq('mobile', mobileNum)
    .then(result => {
      if (result.error) {
        console.error('Error auto-saving vehicles:', result.error);
        return;
      }
      console.log('Vehicles auto-saved:', vehicleArray);
      
      // Update local user object
      user.vehicle_no = vehicleArray;
      const saved = localStorage.getItem('rt_user');
      if (saved) {
        const sd = JSON.parse(saved);
        sd.user = user;
        localStorage.setItem('rt_user', JSON.stringify(sd));
      }
    });
}

// ============================================================
// ROUTE FUNCTIONS
// ============================================================
function addRoute() {
  const route = $('edit-route-hidden').value;
  if (!route) { toast('Please search and select a location first'); return; }
  const routeInt = parseInt(route);
  if (isNaN(routeInt)) { toast('Invalid location'); return; }
  if (routes.indexOf(routeInt) !== -1) { toast('Route already added'); return; }
  routes.push(routeInt);
  $('search-edit-route').value = '';
  $('edit-route-hidden').value = '';
  renderRoutes();
  const sug = $('suggestions-edit-route');
  if (sug) { sug.classList.remove('show'); sug.innerHTML = ''; }
  autoSaveRoutes();
  toast('Route added');
}

function removeRoute(r) {
  if (!confirm('Remove this route?')) return;
  routes = routes.filter(x => x !== r);
  renderRoutes();
  autoSaveRoutes();
  toast('Route removed');
}

function renderRoutes() {
  const container = $('edit-routes-list');
  if (!routes.length) { container.innerHTML = '<span style="color:#94a3b8;font-size:12px">No routes added</span>'; return; }
  container.innerHTML = routes.map(r => {
    const loc = getLoc(r);
    const display = loc ? getLocDisplayName(loc) : r;
    return '<span class="route-tag">' + display + ' <span class="remove" onclick="removeRoute(' + r + ')">✕</span></span>';
  }).join('');
}

function autoSaveRoutes() {
  if (!user || !user.mobile) return;
  
  const mobileNum = parseInt(user.mobile);
  const routesArray = routes.length > 0 ? routes : null;
  
  sb.from('active_users')
    .update({ preferred_routes: routesArray })
    .eq('mobile', mobileNum)
    .then(result => {
      if (result.error) {
        console.error('Error auto-saving routes:', result.error);
        return;
      }
      console.log('Routes auto-saved:', routesArray);
      user.preferred_routes = routesArray;
      const saved = localStorage.getItem('rt_user');
      if (saved) {
        const sd = JSON.parse(saved);
        sd.user = user;
        localStorage.setItem('rt_user', JSON.stringify(sd));
      }
    });
}

// ============================================================
// PROFILE FUNCTIONS
// ============================================================
function loadProfileData() {
  if (!user) return;
  
  $('edit-name').value = user.name || '';
  $('edit-company').value = user.company_name || '';
  $('edit-website').value = user.company_web || '';
  $('edit-pan').value = user.pan || '';
  $('edit-gst').value = user.gst || '';
  
  if (user.location) {
    const loc = getLoc(user.location);
    if (loc) {
      $('search-edit-location').value = getLocDisplayName(loc);
      $('edit-location-hidden').value = user.location;
    }
  }
  
  let types = user.user_type || [];
  if (!Array.isArray(types) && typeof types === 'number') types = [types];
  $('edit-type-loadgiver').checked = types.indexOf(1) !== -1;
  $('edit-type-operator').checked = types.indexOf(2) !== -1;
  $('edit-type-agent').checked = types.indexOf(3) !== -1;
  
  // Load vehicles - handle both array and PostgreSQL array string
  vehicles = [];
  vehicleDataMap = {};
  let vno = user.vehicle_no || [];
  
  if (Array.isArray(vno)) {
    vehicles = vno.filter(v => v !== null && v !== '');
  } else if (typeof vno === 'string' && vno.startsWith('{')) {
    // PostgreSQL array format: {MH12AB1234,MH12CD5678}
    try {
      const cleaned = vno.replace(/[{}]/g, '');
      vehicles = cleaned.split(',').filter(v => v.trim() !== '');
    } catch(e) {
      vehicles = [];
    }
  } else if (typeof vno === 'string') {
    vehicles = vno.split(',').filter(v => v.trim() !== '');
  }
  
  if (vehicles.length) {
    sb.from('active_vehicles').select('*').in('vehicle_number', vehicles)
      .then(res => {
        if (res.data) {
          res.data.forEach(v => {
            const dims = v.dimensions ? v.dimensions.join('×') : 'N/A';
            vehicleDataMap[v.vehicle_number] = {
              id: v.id,
              vehicle_number: v.vehicle_number,
              vehicle_type: v.vehicle_type || 'Unknown',
              dimensions: dims
            };
          });
          renderVehicles();
        }
      });
  }
  renderVehicles();
  
  // Load routes
  routes = [];
  let pref = user.preferred_routes || [];
  if (Array.isArray(pref)) {
    routes = pref.filter(r => r !== null && r !== '');
  } else if (typeof pref === 'string' && pref.startsWith('{')) {
    try {
      const cleaned = pref.replace(/[{}]/g, '');
      routes = cleaned.split(',').filter(r => r.trim() !== '').map(Number);
    } catch(e) {
      routes = [];
    }
  } else if (typeof pref === 'string') {
    routes = pref.split(',').filter(r => r.trim() !== '').map(Number);
  }
  renderRoutes();
  
  $('edit-details').value = user.details || '';
  updateCharCount();
}

function saveProfile() {
  if (!user || !user.mobile) { alert('User not logged in.'); return; }
  
  const types = [];
  if ($('edit-type-loadgiver').checked) types.push(1);
  if ($('edit-type-operator').checked) types.push(2);
  if ($('edit-type-agent').checked) types.push(3);
  const location = $('edit-location-hidden').value ? parseInt($('edit-location-hidden').value) : null;
  
  const updateData = {
    name: $('edit-name').value.trim() || null,
    company_name: $('edit-company').value.trim() || null,
    company_web: $('edit-website').value.trim() || null,
    pan: $('edit-pan').value.trim() || null,
    gst: $('edit-gst').value.trim() || null,
    location: location,
    user_type: types.length ? types : null,
    vehicle_no: vehicles.length ? vehicles : null,
    preferred_routes: routes.length ? routes : null,
    details: $('edit-details').value.trim() || null,
    last_active: new Date().toISOString()
  };
  
  const mobileNum = parseInt(user.mobile);
  sb.from('active_users').update(updateData).eq('mobile', mobileNum)
    .then(result => {
      if (result.error) { alert('Error saving profile: ' + result.error.message); return; }
      sb.from('active_users').select('*').eq('mobile', mobileNum).single()
        .then(freshResult => {
          if (freshResult.data) {
            Object.assign(user, freshResult.data);
            const saved = localStorage.getItem('rt_user');
            if (saved) { const sd = JSON.parse(saved); sd.user = user; localStorage.setItem('rt_user', JSON.stringify(sd)); }
            alert('✅ Profile saved successfully!');
          }
        });
    }).catch(err => { alert('Error: ' + err.message); });
}

function updateCharCount() {
  const input = $('edit-details');
  const count = $('edit-details-count');
  if (input && count) count.textContent = input.value.length;
}

// ============================================================
// NAVIGATION
// ============================================================
function goHome() {
  document.getElementById('home-page').classList.remove('hidden-page');
  document.getElementById('edit-profile-page').classList.add('hidden-page');
  document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.nav-fixed .nav-item')[0]?.classList.add('active');
}

function goToEditProfile() {
  if (!user && !guest) { showLogin(); return; }
  document.getElementById('home-page').classList.add('hidden-page');
  document.getElementById('edit-profile-page').classList.remove('hidden-page');
  document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.nav-fixed .nav-item')[1]?.classList.add('active');
  if (user) loadProfileData();
}

function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('home-page').classList.add('hidden-page');
  document.getElementById('edit-profile-page').classList.add('hidden-page');
}

function continueAsGuest() {
  guest = true;
  user = null;
  localStorage.setItem('rt_user', JSON.stringify({guest: true}));
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('home-page').classList.remove('hidden-page');
  updateGuestUI();
}

function loginUser() {
  const mobile = document.getElementById('mobile').value.trim();
  const pin = document.getElementById('pin').value.trim();
  
  if (!mobile || mobile.length !== 10) {
    document.getElementById('login-error').textContent = 'Please enter a valid 10-digit mobile number';
    document.getElementById('login-error').style.display = 'block';
    return;
  }
  if (!pin || pin.length !== 4) {
    document.getElementById('login-error').textContent = 'Please enter a 4-digit PIN';
    document.getElementById('login-error').style.display = 'block';
    return;
  }
  
  document.getElementById('login-error').style.display = 'none';
  
  sb.from('active_users').select('*').eq('mobile', parseInt(mobile)).single()
    .then(result => {
      if (result.error || !result.data) {
        document.getElementById('login-error').textContent = 'User not found. Please register first.';
        document.getElementById('login-error').style.display = 'block';
        return;
      }
      if (pin.length === 4) {
        user = result.data;
        guest = false;
        localStorage.setItem('rt_user', JSON.stringify({mobile: user.mobile, user: user}));
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('home-page').classList.remove('hidden-page');
        updateGuestUI();
        goToEditProfile();
      } else {
        document.getElementById('login-error').textContent = 'Invalid PIN. Please try again.';
        document.getElementById('login-error').style.display = 'block';
      }
    }).catch(err => {
      document.getElementById('login-error').textContent = 'Error: ' + err.message;
      document.getElementById('login-error').style.display = 'block';
    });
}

function updateGuestUI() {
  if (guest) {
    document.getElementById('avatar-initials').textContent = 'GU';
  } else if (user) {
    let initials = 'U';
    if (user.name) {
      const parts = user.name.split(' ');
      initials = (parts[0]||'')[0] + (parts[1]||'')[0];
    }
    document.getElementById('avatar-initials').textContent = initials.toUpperCase() || 'U';
  }
}

function toggleDropdown() {
  document.querySelectorAll('.profile-dropdown').forEach(d => d.classList.toggle('show'));
}

function closeDropdown() {
  document.querySelectorAll('.profile-dropdown').forEach(d => d.classList.remove('show'));
}

function logout() {
  if (confirm('Logout?')) {
    localStorage.removeItem('rt_user');
    user = null;
    guest = false;
    window.location.reload();
  }
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  const saved = localStorage.getItem('rt_user');
  if (saved) {
    try {
      const sd = JSON.parse(saved);
      if (sd.guest) {
        guest = true;
        user = null;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('home-page').classList.remove('hidden-page');
        updateGuestUI();
      } else if (sd.user) {
        user = sd.user;
        guest = false;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('home-page').classList.remove('hidden-page');
        updateGuestUI();
      }
    } catch(e) { console.error('Error parsing saved user:', e); }
  }
  
  document.getElementById('edit-details')?.addEventListener('input', updateCharCount);
});
