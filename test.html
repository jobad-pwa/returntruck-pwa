<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Install Button Test</title>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#f3f4f6;margin:0;padding:16px;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{max-width:420px;width:100%;background:#fff;border-radius:24px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.1);display:flex;flex-direction:column;height:95vh;max-height:800px;position:relative;overflow:hidden}

/* Header */
.header-fixed{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid #f1f5f9;background:#fff;z-index:10;width:100%;min-height:50px}
.logo{font-size:20px;font-weight:900;color:#2563eb;display:flex;align-items:center;gap:6px}
.logo-icon{font-size:28px}.logo-text{font-size:20px;font-weight:900;color:#2563eb}
.avatar{width:36px;height:36px;border-radius:50%;background:#64748b;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;cursor:pointer}

/* Content */
.scroll-body{flex:1;overflow-y:auto;padding:16px 0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.test-box{background:#f8fafc;border:2px dashed #94a3b8;border-radius:12px;padding:24px;text-align:center;width:100%}
.test-box .icon{font-size:48px;display:block;margin-bottom:12px}
.test-box h3{font-size:16px;color:#1e293b;margin:0 0 8px}
.test-box p{font-size:13px;color:#64748b;margin:0}
.status-box{margin-top:16px;padding:12px;border-radius:8px;width:100%;text-align:center;font-size:13px;font-weight:600}
.status-box.success{background:#dcfce7;color:#166534}
.status-box.error{background:#fef2f2;color:#991b1b}
.status-box.info{background:#dbeafe;color:#1e40af}
.status-box.pending{background:#fef3c7;color:#92400e}

/* Bottom Navigation */
.nav-fixed{flex-shrink:0;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #e2e8f0;background:#fff;position:relative;z-index:10;min-height:65px;width:100%;padding-bottom:5px;margin-top:auto}
.nav-item{display:flex;flex-direction:column;align-items:center;color:#94a3b8;font-size:9px;font-weight:600;cursor:pointer;border:none;background:transparent;padding:6px 12px;position:relative;z-index:2}
.nav-item.active{color:#2563eb}
.nav-item .icon{font-size:22px;margin-bottom:2px}
.nav-item .label{font-size:9px;text-transform:uppercase;letter-spacing:.05em}

/* Install Button - Floating above nav */
.nav-install-wrapper{position:absolute;left:50%;top:-22px;transform:translateX(-50%);z-index:5;display:none}
.nav-install-wrapper.show{display:block}
.nav-install-btn{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:30px;padding:4px 14px;font-size:10px;font-weight:700;cursor:pointer;box-shadow:0 4px 15px rgba(37,99,235,0.4);display:flex;align-items:center;gap:4px;white-space:nowrap;animation:pulse-install 2s infinite;letter-spacing:0.3px}
.nav-install-btn .install-icon{font-size:12px}
.nav-install-btn .install-badge{background:#ef4444;color:#fff;font-size:6px;font-weight:700;padding:1px 5px;border-radius:10px;margin-left:2px}
@keyframes pulse-install{0%{transform:scale(1);box-shadow:0 4px 15px rgba(37,99,235,0.4)}50%{transform:scale(1.05);box-shadow:0 4px 25px rgba(37,99,235,0.6)}100%{transform:scale(1);box-shadow:0 4px 15px rgba(37,99,235,0.4)}}

/* Controls */
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;width:100%}
.controls button{flex:1;padding:8px 12px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;min-width:60px}
.btn-primary{background:#2563eb;color:#fff}
.btn-primary:hover{background:#1d4ed8}
.btn-success{background:#16a34a;color:#fff}
.btn-success:hover{background:#15803d}
.btn-danger{background:#dc2626;color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-gray{background:#6b7280;color:#fff}
.btn-gray:hover{background:#4b5563}

.log-box{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:12px;font-family:monospace;font-size:11px;max-height:120px;overflow-y:auto;margin-top:12px;width:100%;white-space:pre-wrap;word-break:break-all}
.log-box .pass{color:#4ade80}
.log-box .fail{color:#f87171}
.log-box .info{color:#60a5fa}
.log-box .highlight{color:#f472b6}
</style>
</head>
<body>
<div class="card">

    <!-- HEADER -->
    <div class="header-fixed">
        <div class="logo"><span class="logo-icon">🚛</span><span class="logo-text">ReturnTruck</span></div>
        <div class="avatar">GU</div>
    </div>

    <!-- CONTENT -->
    <div class="scroll-body">
        <div class="test-box">
            <span class="icon">📲</span>
            <h3>Install Button Test</h3>
            <p>Check if install button appears at bottom navigation</p>
        </div>

        <div id="status-box" class="status-box info">⏳ Checking install status...</div>

        <div class="controls">
            <button class="btn-primary" onclick="showInstall()">👆 Show Install</button>
            <button class="btn-success" onclick="hideInstall()">👆 Hide Install</button>
            <button class="btn-danger" onclick="toggleInstall()">🔄 Toggle</button>
            <button class="btn-gray" onclick="clearLog()">🗑️ Clear</button>
        </div>

        <div class="log-box" id="log">⏳ Waiting for tests...</div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="nav-fixed" id="bottom-nav">
        <button class="nav-item active"><span class="icon">🏠</span><span class="label">Home</span></button>

        <!-- INSTALL BUTTON -->
        <div class="nav-install-wrapper" id="nav-install-wrapper">
            <button class="nav-install-btn" id="nav-install-btn" onclick="forceInstall()">
                <span class="install-icon">📲</span> Install <span class="install-badge">NEW</span>
            </button>
        </div>

        <button class="nav-item"><span class="icon">📦</span><span class="label">Load</span></button>
        <button class="nav-item"><span class="icon">🚛</span><span class="label">Truck</span></button>
        <button class="nav-item"><span class="icon">👤</span><span class="label">Profile</span></button>
    </div>

</div>

<script>
// ============================================================
// STATE
// ============================================================
var installed = false;
var prompt = null;

function $(id){return document.getElementById(id)}

// ============================================================
// LOGGING
// ============================================================
function log(msg, type){
    var el = $('log');
    var time = new Date().toLocaleTimeString();
    var colors = { pass: 'pass', fail: 'fail', info: 'info', highlight: 'highlight' };
    el.innerHTML += '[' + time + '] <span class="' + (colors[type] || 'info') + '">' + msg + '</span>\n';
    el.scrollTop = el.scrollHeight;
}

function clearLog(){
    $('log').innerHTML = '';
    log('🗑️ Log cleared', 'info');
}

function setStatus(text, type){
    var el = $('status-box');
    el.textContent = text;
    el.className = 'status-box ' + (type || 'info');
}

// ============================================================
// INSTALL BUTTON FUNCTIONS
// ============================================================

// Check if app is already installed
if(window.matchMedia('(display-mode: standalone)').matches){
    installed = true;
}

function updateInstallButton(){
    // Show install button only if:
    // 1. User is on mobile
    // 2. Not already installed
    // 3. Not in standalone mode
    var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    var show = isMobile && !window.matchMedia('(display-mode: standalone)').matches && !installed;
    
    var wrapper = $('nav-install-wrapper');
    if(wrapper){
        wrapper.classList.toggle('show', show);
        if(show){
            log('✅ Install button SHOWING (mobile, not installed)', 'pass');
            setStatus('✅ Install button is visible', 'success');
        }else{
            log('❌ Install button HIDDEN (not mobile or already installed)', 'fail');
            if(installed){
                setStatus('📱 App already installed', 'success');
            }else if(!isMobile){
                setStatus('💻 Desktop browser - no install button', 'info');
            }else{
                setStatus('⏳ Install button hidden', 'pending');
            }
        }
    }
}

// Show install button manually (for testing)
function showInstall(){
    var wrapper = $('nav-install-wrapper');
    if(wrapper){
        wrapper.classList.add('show');
        log('👆 Install button SHOWN (manual)', 'pass');
        setStatus('✅ Install button manually shown', 'success');
    }
}

// Hide install button manually (for testing)
function hideInstall(){
    var wrapper = $('nav-install-wrapper');
    if(wrapper){
        wrapper.classList.remove('show');
        log('👆 Install button HIDDEN (manual)', 'info');
        setStatus('❌ Install button manually hidden', 'error');
    }
}

// Toggle install button (for testing)
function toggleInstall(){
    var wrapper = $('nav-install-wrapper');
    if(wrapper){
        wrapper.classList.toggle('show');
        var isShown = wrapper.classList.contains('show');
        log('🔄 Toggle: ' + (isShown ? 'SHOWING' : 'HIDDEN'), isShown ? 'pass' : 'info');
        setStatus(isShown ? '✅ Install button visible' : '❌ Install button hidden', isShown ? 'success' : 'error');
    }
}

// Force install (simulate)
function forceInstall(){
    log('📲 Install button clicked!', 'highlight');
    setStatus('📲 Install requested...', 'pending');
    toast('📲 Install button clicked! (simulated)');
    
    // Simulate installation
    if(prompt){
        prompt.prompt();
        prompt.userChoice.then(function(c){
            if(c.outcome === 'accepted'){
                installed = true;
                updateInstallButton();
                toast('🎉 App installed!');
            }
        });
    }else{
        // For demo: simulate install
        setTimeout(function(){
            installed = true;
            updateInstallButton();
            toast('🎉 App "installed" (simulated)');
        }, 1500);
    }
}

// ============================================================
// PWA EVENTS
// ============================================================

// Listen for beforeinstallprompt
window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    prompt = e;
    log('📱 beforeinstallprompt fired!', 'pass');
    setStatus('📱 Install prompt ready', 'success');
    updateInstallButton();
});

// Listen for app installed
window.addEventListener('appinstalled', function(){
    installed = true;
    prompt = null;
    log('🎉 App installed successfully!', 'pass');
    setStatus('🎉 App installed!', 'success');
    updateInstallButton();
});

// ============================================================
// TOAST (simple alert)
// ============================================================
function toast(msg){
    alert(msg);
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', function(){
    log('🚀 Install Button Test initialized', 'info');
    log('📱 Device: ' + navigator.userAgent, 'info');
    log('📱 Standalone mode: ' + (window.matchMedia('(display-mode: standalone)').matches ? 'YES' : 'NO'), 'info');
    log('📱 Installed: ' + (installed ? 'YES' : 'NO'), 'info');
    log('----------------------------------------', 'info');
    
    // Update install button on load
    setTimeout(function(){
        updateInstallButton();
    }, 500);
    
    // Also update after 3 seconds (for demo)
    setTimeout(function(){
        log('🔄 Re-checking install status...', 'info');
        updateInstallButton();
    }, 3000);
});

// ============================================================
// TEST SCENARIOS - Quick test buttons
// ============================================================

// Simulate mobile device (for testing in desktop)
function simulateMobile(){
    // Only for testing - doesn't actually change userAgent
    log('📱 Simulating mobile...', 'info');
    // Force show install button
    var wrapper = $('nav-install-wrapper');
    if(wrapper){
        wrapper.classList.add('show');
        setStatus('✅ Simulated mobile - install button shown', 'success');
        log('✅ Install button forced to show (simulation)', 'pass');
    }
}

// Simulate installed (for testing)
function simulateInstalled(){
    installed = true;
    prompt = null;
    log('📱 Simulating app installed...', 'info');
    updateInstallButton();
    setStatus('📱 Simulated installed', 'success');
    log('✅ Install button hidden (simulated installed)', 'pass');
}

// Add simulation buttons dynamically
document.addEventListener('DOMContentLoaded', function(){
    var controls = document.querySelector('.controls');
    var simDiv = document.createElement('div');
    simDiv.className = 'controls';
    simDiv.style.marginTop = '6px';
    simDiv.innerHTML = `
        <button class="btn-primary" onclick="simulateMobile()">📱 Simulate Mobile</button>
        <button class="btn-success" onclick="simulateInstalled()">✅ Simulate Installed</button>
        <button class="btn-gray" onclick="updateInstallButton()">🔄 Re-check</button>
    `;
    controls.parentNode.insertBefore(simDiv, controls.nextSibling);
});
</script>
</body>
</html>
