<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To Location Filter Test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui;background:#0a0a12;color:#e2e8f0;padding:20px;max-width:900px;margin:0 auto}
.card{background:#1a1a2e;border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid #2d2d3d}
button{background:#2563eb;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:600;margin:4px}
button:hover{background:#1d4ed8}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
th{text-align:left;color:#94a3b8;border-bottom:1px solid #2d2d3d;padding:6px 8px}
td{padding:6px 8px;border-bottom:1px solid #1a1a2e}
.pass{color:#4ade80}
.fail{color:#f87171}
.highlight{background:#2563eb33;padding:2px 6px;border-radius:4px}
.log{font-size:12px;color:#94a3b8;padding:4px 0;font-family:monospace}
</style>
</head>
<body>

<div class="card">
    <h2>🔍 To Location Filter Test</h2>
    <p>This test isolates the "To Location" filter to identify the bug.</p>
    <div>
        <button onclick="runTest()">▶ Run Test</button>
        <button onclick="clearResults()">Clear</button>
    </div>
</div>

<div id="results"></div>

<script>
// ============================================================
// CONFIG
// ============================================================
const SB_URL = 'https://ghjoffovatgvhzxlupef.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdoam9mZm92YXRndmh6eGx1cGVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MDM4MjQsImV4cCI6MjEwMDk3OTgyNH0.bGDIHZDcLdZqJl9u5qhDm5mlGfWR3fp1sxrpwCtsDsg';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

// ============================================================
// LOCATIONS
// ============================================================
const LOCATIONS = [
    { pin_id: 53300104, pincode: "533001", name: "Kakinada", district: "Kakinada", state: "AP", lat: 16.9550556, lng: 82.2354722 },
    { pin_id: 53340114, pincode: "533401", name: "Tuni", district: "Kakinada", state: "AP", lat: 17.3581389, lng: 82.5455278 },
    { pin_id: 52400103, pincode: "524001", name: "Nellore", district: "SPSR NELLORE", state: "AP", lat: 14.451895, lng: 79.980856 },
    { pin_id: 50000101, pincode: "500001", name: "Hyderabad G.P.O.", district: "HYDERABAD", state: "TG", lat: 17.387993, lng: 78.47652 },
    { pin_id: 50006201, pincode: "500062", name: "Ecil", district: "MEDCHAL MALKAJGIRI", state: "TG", lat: 17.465795, lng: 78.570653 },
];

function getLoc(pinId) {
    if (!pinId) return null;
    const pinNum = parseInt(pinId);
    if (isNaN(pinNum)) return null;
    const exact = LOCATIONS.find(l => l.pin_id === pinNum);
    if (exact) return exact;
    // Try pincode match (first 6 digits)
    const pinStr = String(pinNum);
    if (pinStr.length >= 6) {
        const pincode = pinStr.substring(0, 6);
        const matches = LOCATIONS.filter(l => l.pincode === pincode);
        if (matches.length > 0) return matches[0];
    }
    return null;
}

function getLocName(pinId) {
    const l = getLoc(pinId);
    return l ? l.name + ' (' + l.pincode + ')' : String(pinId);
}

function dist(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLng/2) * Math.sin(dLng/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function log(msg) {
    const el = document.getElementById('log');
    if (el) el.innerHTML += msg + '\n';
}

// ============================================================
// TEST FUNCTION
// ============================================================
async function runTest() {
    const container = document.getElementById('results');
    container.innerHTML = '<div class="card"><h3>⏳ Running test...</h3></div>';

    try {
        // Fetch loads
        const { data: loads } = await sb.from('active_loads').select('*').eq('status', 1);
        
        if (!loads || loads.length === 0) {
            container.innerHTML = '<div class="card"><h3>❌ No loads found in database</h3></div>';
            return;
        }

        // ============================================================
        // TEST SETUP
        // ============================================================
        const HOME_PIN = 50000101; // Hyderabad
        const TO_PIN = 53300104;   // Kakinada
        const RADIUS = 100;

        const homeLoc = getLoc(HOME_PIN);
        const toLoc = getLoc(TO_PIN);

        // Get FIRST 6 DIGITS of To Location pincode
        const toPincode = String(toLoc.pincode).substring(0, 6);

        // ============================================================
        // STEP 1: Filter by Home Location
        // ============================================================
        let homeFiltered = loads.filter(l => {
            const loc = getLoc(l.pickup_pin);
            if (loc) {
                const d = dist(homeLoc.lat, homeLoc.lng, loc.lat, loc.lng);
                return d <= RADIUS;
            }
            // Pincode fallback
            const pinStr = String(l.pickup_pin);
            if (pinStr.length >= 6) {
                const pincode = pinStr.substring(0, 6);
                return pincode === String(homeLoc.pincode);
            }
            return false;
        });

        // ============================================================
        // STEP 2: TEST TO LOCATION FILTER - 3 DIFFERENT METHODS
        // ============================================================
        
        // Method 1: Compare drop_pin FIRST 6 DIGITS with To Location pincode
        let method1 = homeFiltered.filter(l => {
            const dropPinStr = String(l.drop_pin);
            if (dropPinStr.length >= 6) {
                const dropPincode = dropPinStr.substring(0, 6);
                return dropPincode === toPincode;
            }
            return false;
        });

        // Method 2: Compare using getLoc() and distance
        let method2 = homeFiltered.filter(l => {
            const loc = getLoc(l.drop_pin);
            if (loc && toLoc) {
                const d = dist(toLoc.lat, toLoc.lng, loc.lat, loc.lng);
                return d <= RADIUS;
            }
            return false;
        });

        // Method 3: Compare using getLoc() AND first 6 digits (combined)
        let method3 = homeFiltered.filter(l => {
            // First try distance
            const loc = getLoc(l.drop_pin);
            if (loc && toLoc) {
                const d = dist(toLoc.lat, toLoc.lng, loc.lat, loc.lng);
                if (d <= RADIUS) return true;
            }
            // Then try pincode match
            const dropPinStr = String(l.drop_pin);
            if (dropPinStr.length >= 6) {
                const dropPincode = dropPinStr.substring(0, 6);
                if (dropPincode === toPincode) return true;
            }
            return false;
        });

        // ============================================================
        // BUILD RESULTS TABLE
        // ============================================================
        let html = '';

        // Summary
        html += `<div class="card">
            <h3>📊 Test Results</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:10px 0">
                <div style="background:#12121e;padding:12px;border-radius:8px;text-align:center">
                    <div style="font-size:24px;color:#94a3b8">📦</div>
                    <div style="font-size:28px;font-weight:700;color:#2563eb">${loads.length}</div>
                    <div style="font-size:11px;color:#64748b">Total Loads</div>
                </div>
                <div style="background:#12121e;padding:12px;border-radius:8px;text-align:center">
                    <div style="font-size:24px;color:#4ade80">🏠</div>
                    <div style="font-size:28px;font-weight:700;color:#4ade80">${homeFiltered.length}</div>
                    <div style="font-size:11px;color:#64748b">Within ${RADIUS} KM of ${homeLoc.name}</div>
                </div>
                <div style="background:#12121e;padding:12px;border-radius:8px;text-align:center">
                    <div style="font-size:24px;color:#f87171">🎯</div>
                    <div style="font-size:28px;font-weight:700;color:#f87171">${method1.length}</div>
                    <div style="font-size:11px;color:#64748b">To Location: ${toLoc.name}</div>
                </div>
            </div>
            <div style="font-size:13px;color:#94a3b8;padding:8px;background:#12121e;border-radius:8px">
                <div>📍 Home: ${getLocName(HOME_PIN)}</div>
                <div>📍 To: ${getLocName(TO_PIN)}</div>
                <div>📏 To Pincode (first 6): <span class="highlight">${toPincode}</span></div>
                <div>📐 Radius: ${RADIUS} KM</div>
            </div>
        </div>`;

        // ============================================================
        // DETAILED TABLE - Show all loads with their drop_pin comparison
        // ============================================================
        html += `<div class="card">
            <h3>📋 All Loads (Home Filtered: ${homeFiltered.length})</h3>
            <table>
                <tr>
                    <th>Material</th>
                    <th>Pickup</th>
                    <th>Drop PIN</th>
                    <th>Drop Pincode (first 6)</th>
                    <th>Matches To?</th>
                    <th>Status</th>
                </tr>`;

        homeFiltered.forEach(l => {
            const dropPinStr = String(l.drop_pin);
            let dropPincode = dropPinStr.length >= 6 ? dropPinStr.substring(0, 6) : 'N/A';
            const matches = dropPincode === toPincode;
            
            // Also check distance
            const loc = getLoc(l.drop_pin);
            let distance = 'N/A';
            if (loc && toLoc) {
                distance = Math.round(dist(toLoc.lat, toLoc.lng, loc.lat, loc.lng)) + ' KM';
            }
            
            const status = matches ? '✅ PASS' : '❌ FILTERED OUT';
            const color = matches ? 'color:#4ade80;' : 'color:#f87171;';
            
            html += `<tr style="${color}">
                <td>${l.material || 'N/A'}</td>
                <td>${getLocName(l.pickup_pin)}</td>
                <td>${l.drop_pin}</td>
                <td><span class="highlight">${dropPincode}</span></td>
                <td>${matches ? '✅ Yes' : '❌ No'}</td>
                <td><strong>${status}</strong></td>
            </tr>`;
        });

        html += `</table></div>`;

        // ============================================================
        // COMPARE METHODS
        // ============================================================
        html += `<div class="card">
            <h3>🔬 Method Comparison</h3>
            <table>
                <tr><th>Method</th><th>Description</th><th>Count</th><th>Result</th></tr>
                <tr>
                    <td>Method 1</td>
                    <td>First 6 digits of drop_pin === To pincode</td>
                    <td><strong>${method1.length}</strong></td>
                    <td class="${method1.length > 0 ? 'pass' : 'fail'}">${method1.length > 0 ? '✅ Working' : '❌ Not working'}</td>
                </tr>
                <tr>
                    <td>Method 2</td>
                    <td>Distance from To location to drop location</td>
                    <td><strong>${method2.length}</strong></td>
                    <td class="${method2.length > 0 ? 'pass' : 'fail'}">${method2.length > 0 ? '✅ Working' : '❌ Not working'}</td>
                </tr>
                <tr>
                    <td>Method 3</td>
                    <td>Combined (Distance + First 6 digits)</td>
                    <td><strong>${method3.length}</strong></td>
                    <td class="${method3.length > 0 ? 'pass' : 'fail'}">${method3.length > 0 ? '✅ Working' : '❌ Not working'}</td>
                </tr>
            </table>
            <div style="margin-top:12px;padding:12px;background:#12121e;border-radius:8px">
                <div style="font-weight:600;color:#2563eb">💡 Diagnosis:</div>
                <div style="font-size:13px;color:#94a3b8;margin-top:4px">
                    ${method1.length === 0 && method2.length === 0 && method3.length === 0 ? 
                        '❌ TO LOCATION FILTER IS NOT WORKING. No loads match the To Location.' :
                        method1.length > 0 ? 
                        '✅ Method 1 (First 6 digits) is working. The bug is likely in the index.html implementation.' :
                        method2.length > 0 ?
                        '⚠️ Method 2 (Distance) is working but Method 1 is not. Check pincode extraction.' :
                        '⚠️ Only Method 3 is working. Check index.html filter logic.'
                    }
                </div>
                <div style="font-size:12px;color:#64748b;margin-top:8px;font-family:monospace;white-space:pre-wrap">
                    To Pincode: ${toPincode}
                    Expected matches: Loads with drop_pin starting with "${toPincode}"
                    ${homeFiltered.map(l => {
                        const dp = String(l.drop_pin);
                        const pc = dp.length >= 6 ? dp.substring(0, 6) : 'N/A';
                        const match = pc === toPincode;
                        return `\n  ${l.material || 'N/A'}: drop_pin=${l.drop_pin} → pincode=${pc} ${match ? '✅ MATCH' : '❌ NO'}`;
                    }).join('')}
                </div>
            </div>
        </div>`;

        container.innerHTML = html;

    } catch (error) {
        container.innerHTML = `<div class="card"><h3 class="error">❌ Error</h3><p>${error.message}</p></div>`;
        console.error(error);
    }
}

function clearResults() {
    document.getElementById('results').innerHTML = '';
}

// Auto-run on load
document.addEventListener('DOMContentLoaded', function() {
    runTest();
});

</script>
</body>
</html>
