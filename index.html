<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ReturnTruck</title>
<script src="https://cdn.tailwindcss.com"></script>

<meta name="theme-color" content="#2563eb">
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#f3f4f6;margin:0;padding:16px;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{max-width:420px;width:100%;background:#fff;border-radius:24px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.1);display:flex;flex-direction:column;height:95vh;max-height:900px;position:relative;overflow:hidden}
.hidden-page{display:none}
.page-wrapper{display:flex;flex-direction:column;height:100%;width:100%;overflow:hidden;position:relative}

/* HEADER */
.header{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid #f1f5f9;background:#fff;z-index:10;position:relative}
.logo{font-size:22px;font-weight:900;color:#2563eb;cursor:pointer}
.header-right{display:flex;align-items:center;gap:8px;position:relative}
.back-btn{background:0;border:none;font-size:14px;font-weight:600;color:#475569;cursor:pointer;padding:4px 10px;background:#f1f5f9;border-radius:8px}

/* AVATAR & DROPDOWN */
.avatar-btn{width:36px;height:36px;border-radius:50%;border:2px solid #e2e8f0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;background:#94a3b8}
.avatar-btn.guest{background:linear-gradient(135deg,#64748b,#475569)}
.profile-dropdown{position:absolute;top:44px;right:0;background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:160px;z-index:100;display:none}
.profile-dropdown.show{display:block}
.dropdown-item{padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;color:#1e293b;cursor:pointer;border:none;background:0 0;width:100%}
.dropdown-item:hover{background:#f8fafc}
.dropdown-item.danger{color:#dc2626}

/* BANNERS */
.guest-banner{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;padding:6px 12px;border-radius:10px;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-shrink:0}
.guest-banner .btn-login{background:#fff;color:#2563eb;border:none;padding:4px 14px;border-radius:6px;font-weight:600;cursor:pointer}

/* BOTTOM NAVIGATION - Fixed to bottom on ALL pages */
.bottom-nav{flex-shrink:0;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #e2e8f0;background:#fff;z-index:10;min-height:55px;padding:4px 0;width:100%;margin-top:auto}
.nav-item{display:flex;flex-direction:column;align-items:center;color:#94a3b8;font-size:8px;font-weight:600;cursor:pointer;border:none;background:0 0;padding:2px 12px;text-transform:uppercase}
.nav-item.active{color:#2563eb}
.nav-item .icon{font-size:20px;margin-bottom:2px}

/* CONTENT - Fills remaining space exactly */
.page-content{flex:1;overflow-y:auto;padding:4px 0;-webkit-overflow-scrolling:touch}
.page-content::-webkit-scrollbar{width:3px}
.page-content::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}

/* FORMS & CARDS */
.form-control{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:12px;font-size:14px;background:#fff;outline:0}
.form-control:focus{border-color:#2563eb}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-primary{width:100%;padding:14px;background:#2563eb;color:#fff;border:none;border-radius:12px;font-weight:600;cursor:pointer}
.btn-green{background:#16a34a}.btn-back{width:100%;padding:14px;background:#6b7280;color:#fff;border:none;border-radius:12px;font-weight:600;cursor:pointer}
.input-field{padding:14px 16px;border:2px solid #e2e8f0;border-radius:12px;font-size:16px;text-align:center;width:100%}

/* LOCATION */
.location-wrapper{position:relative}
.location-wrapper .suggestions{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin-top:4px;max-height:180px;overflow-y:auto;z-index:50;display:none}
.location-wrapper .suggestions.show{display:block}
.location-wrapper .suggestions .item{padding:8px 12px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;border-bottom:1px solid #f8fafc}
.location-wrapper .suggestions .item:hover{background:#f1f5f9}
.location-wrapper .suggestions .item:last-child{border-bottom:none}
.suggestions .name-part{font-weight:600;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suggestions .pin-part{color:#64748b;font-weight:500;font-size:11px;text-align:right;max-width:40%;white-space:nowrap}

/* TABS */
.type-tabs{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;background:#e2e8f0;padding:3px;border-radius:10px;margin-bottom:6px}
.type-tabs button{padding:4px;font-size:10px;font-weight:700;border:none;border-radius:8px;cursor:pointer}
.type-tabs .active{background:#fff;color:#1e293b}
.type-tabs .inactive{background:0 0;color:#64748b}

/* DETAIL & PROFILE */
.detail-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.detail-actions button{width:100%;padding:6px;border-radius:10px;font-weight:600;border:none;color:#fff;display:flex;flex-direction:column;align-items:center}
.btn-call{background:#16a34a}.btn-contact{background:#2563eb}.btn-bid{background:#8b5cf6}.btn-share{background:#25D366}
.profile-section{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-bottom:12px}
.modal-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;border-radius:24px}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:20px;padding:24px;max-width:340px;width:90%}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:8px 16px;border-radius:999px;z-index:1000;animation:fadeOut 2s forwards}
@keyframes fadeOut{0%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
</style>
</head>
<body>
<div class="card">

<!-- LOGIN SCREEN -->
<div id="login-screen" style="display:flex;flex-direction:column;height:100%;overflow-y:auto;padding:4px 0">
    <div style="font-size:32px;font-weight:900;color:#2563eb;text-align:center">🚚 ReturnTruck</div>
    <div style="text-align:center;color:#64748b;font-size:12px;margin-bottom:8px">Find Loads • Post Trucks</div>
    
    <div class="login-stats-container" style="background:#eff6ff;border-radius:16px;padding:12px;border:1px solid #bfdbfe">

            <div style="text-align:center"><div id="stat-visits" style="font-weight:800;color:#1d4ed8">0</div><div style="font-size:8px;font-weight:600;color:#475569">Visits</div></div>

        </div>
    </div>

    <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
        <div id="step1"><input type="tel" id="mobile" class="input-field" placeholder="Enter Mobile Number" maxlength="10"><div id="mobile-status" class="text-xs mt-1"></div><button class="btn-primary" style="background:transparent;border:1.5px solid #8b5cf6;color:#8b5cf6;margin-top:10px" onclick="continueAsGuest()">👤 Guest</button></div>
        <div id="step2" class="hidden-page"><div class="text-center"><div id="display-mobile" style="font-size:20px;font-weight:700">--</div><div class="text-sm font-medium text-green-600">Enter PIN</div></div><input type="password" id="pin" class="input-field" placeholder="Enter 4-digit PIN" maxlength="4" style="margin-top:10px"><button onclick="submitPin()" id="submitBtn" class="btn-primary btn-green" style="margin-top:8px">🔐 Login</button><button onclick="resetForm()" class="btn-back" style="margin-top:4px">← Change Number</button></div>
    </div>
</div>

<!-- HOME PAGE -->
<div id="home-page" class="hidden-page"><div class="page-wrapper">
    <div class="header"><div class="logo">🚚 ReturnTruck</div><div class="header-right"><button class="avatar-btn guest" id="avatar-btn" onclick="toggleDropdown()"><span class="avatar-initials" id="avatar-initials">👤</span></button><div class="profile-dropdown" id="profile-dropdown"><button class="dropdown-item" onclick="closeDropdown();goToProfile()">👤 Profile</button><button class="dropdown-item" onclick="closeDropdown();openChangePin()">🔑 Change PIN</button><div class="dropdown-divider"></div><button class="dropdown-item danger" onclick="closeDropdown();logout()">🚪 Logout</button></div></div></div>
    
    <div id="guest-banner" class="guest-banner hidden-page"><span>👋 Welcome, Guest!</span><button class="btn-login" onclick="showLogin()">🔐 Login</button></div>
    
    <div style="flex-shrink:0;padding:4px 0">
        <div style="display:flex;gap:8px;margin-bottom:6px"><div style="flex:2"><input type="text" id="location-search" placeholder="📍 Location/PIN" class="form-control"></div><div style="flex:1"><select id="radius-select" class="form-control"><option value="50" selected>50 KM</option></select></div></div>
        <div class="type-tabs"><button id="tab-all" class="active" onclick="setTab('ALL')">All</button><button id="tab-loads" class="inactive" onclick="setTab('LOAD')">Loads</button><button id="tab-trucks" class="inactive" onclick="setTab('TRUCK')">Trucks</button></div>
    </div>

    <div class="page-content"><div id="feed-container"></div></div>
    
    <div class="bottom-nav"><button class="nav-item active" onclick="goHome()"><span class="icon">🏠</span>Home</button><button class="nav-item" onclick="goPostLoad()"><span class="icon">📦</span>Post Load</button><button class="nav-item" onclick="goPostTruck()"><span class="icon">🚛</span>Post Truck</button><button class="nav-item" onclick="goToProfile()"><span class="icon">👤</span>Profile</button></div>
</div></div>

<!-- POST LOAD PAGE -->
<div id="postload-page" class="hidden-page"><div class="page-wrapper">
    <div class="header"><div class="logo">🚚 ReturnTruck</div><button class="back-btn" onclick="goHome()">Cancel</button></div>
    <div class="page-content">
        <div style="margin-bottom:12px"><label style="font-size:11px;font-weight:700">Material</label><select class="form-control" id="pl-material"><option>Steel</option><option>Cement</option></select></div>
        <div class="grid-2"><div><label style="font-size:11px;font-weight:700">Weight (Kg)</label><input class="form-control" type="number" id="pl-weight"></div><div><label style="font-size:11px;font-weight:700">Rate (₹)</label><input class="form-control" type="text" id="pl-rate"></div></div>
        <button class="btn-primary" style="margin-top:8px" onclick="publishLoad()">📤 Publish Load</button>
    </div>
    <div class="bottom-nav"><button class="nav-item" onclick="goHome()">🏠 Home</button><button class="nav-item active">📦 Post Load</button><button class="nav-item" onclick="goPostTruck()">🚛 Post Truck</button><button class="nav-item" onclick="goToProfile()">👤 Profile</button></div>
</div></div>

<!-- POST TRUCK PAGE -->
<div id="posttruck-page" class="hidden-page"><div class="page-wrapper">
    <div class="header"><div class="logo">🚚 ReturnTruck</div><button class="back-btn" onclick="goHome()">Cancel</button></div>
    <div class="page-content">
        <div style="margin-bottom:12px"><label style="font-size:11px;font-weight:700">Vehicle Number</label><input class="form-control" id="pt-number"></div>
        <div><label style="font-size:11px;font-weight:700">Location</label><div class="location-wrapper"><input type="text" id="pt-location-input" class="form-control" placeholder="Search PIN..."><div class="suggestions" id="pt-location-suggestions"></div><input type="hidden" id="pt-location-hidden"></div></div>
        <button class="btn-primary" style="margin-top:8px" onclick="publishTruck()">📤 List Truck</button>
    </div>
    <div class="bottom-nav"><button class="nav-item" onclick="goHome()">🏠 Home</button><button class="nav-item" onclick="goPostLoad()">📦 Post Load</button><button class="nav-item active">🚛 Post Truck</button><button class="nav-item" onclick="goToProfile()">👤 Profile</button></div>
</div></div>

<!-- PROFILE PAGE -->
<div id="profile-page" class="hidden-page"><div class="page-wrapper">
    <div class="header"><div class="logo">🚚 ReturnTruck</div><div class="header-right"><button class="back-btn" onclick="goHome()">← Back</button><button class="avatar-btn guest" id="avatar-btn-profile" onclick="toggleDropdown()"><span class="avatar-initials" id="avatar-initials-profile">👤</span></button><div class="profile-dropdown" id="profile-dropdown-profile"><button class="dropdown-item" onclick="closeDropdown();openChangePin()">🔑 Change PIN</button><div class="dropdown-divider"></div><button class="dropdown-item danger" onclick="closeDropdown();logout()">🚪 Logout</button></div></div></div>
    <div class="page-content" id="profile-page-content">
        <div style="background:#2563eb;border-radius:16px;padding:16px;color:#fff;margin-bottom:12px"><div id="profile-mobile" style="font-size:20px;font-weight:700">--</div></div>
        <div class="profile-section"><div style="font-weight:700;color:#1e293b;font-size:14px">📦 Load Giver</div><div id="loadgiver-input-area"><input class="form-control" style="margin-bottom:8px;margin-top:8px" type="text" id="lg-company" placeholder="Company Name"><button class="btn-primary" onclick="saveLoadGiverProfile()">💾 Save</button></div></div>
        <div class="profile-section"><div style="font-weight:700;color:#1e293b;font-size:14px">🚛 Fleet Operator</div><div id="fleet-input-area"><input class="form-control" style="margin-bottom:8px;margin-top:8px" type="text" id="fo-company" placeholder="Company Name"><button class="btn-primary" onclick="saveFleetProfile()">💾 Save</button></div></div>
    </div>
    <div class="bottom-nav"><button class="nav-item" onclick="goHome()">🏠 Home</button><button class="nav-item" onclick="goPostLoad()">📦 Post Load</button><button class="nav-item" onclick="goPostTruck()">🚛 Post Truck</button><button class="nav-item active">👤 Profile</button></div>
</div></div>

</div>

// RESTORED LOCATION HELPERS

function findLocation(q) { 
    const query = q.toLowerCase().trim(); 
    if(!query) return []; 
    return STATIC_LOCATIONS.filter(l => l.name.toLowerCase().includes(query) || l.pin.includes(query)).slice(0, 8); 
}
function getLocationByPin(pin) { return STATIC_LOCATIONS.find(l => l.pin === pin) || null; }
function getLocationName(pin) { const loc = getLocationByPin(pin); return loc ? `${loc.name} (${loc.pin})` : pin || 'Unknown'; }
function getDistance(lat1,lng1,lat2,lng2){ const R=6371; const dLat=(lat2-lat1)*Math.PI/180; const dLng=(lng2-lng1)*Math.PI/180; const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2); return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }

// ============================================================

// ============================================================
function goHome(){switchPage('home-page');document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));document.querySelectorAll('#home-page .nav-item')[0].classList.add('active');renderFeed()}
function goPostLoad(){switchPage('postload-page');document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));document.querySelectorAll('#postload-page .nav-item')[1].classList.add('active')}

function showLogin(){['step1','step2'].forEach(i=>$(i).classList.add('hidden-page'));$('step1').classList.remove('hidden-page');['home-page','profile-page','postload-page','posttruck-page'].forEach(i=>$(i).classList.add('hidden-page'));$('login-screen').style.display='flex';$('mobile').focus()}
function showHome(){['step1','step2'].forEach(i=>$(i).classList.add('hidden-page'));$('login-screen').style.display='none';$('home-page').classList.remove('hidden-page');renderFeed()}
function resetForm(){['step1','step2'].forEach(i=>$(i).classList.add('hidden-page'));$('step1').classList.remove('hidden-page');$('mobile').value='';$('pin').value=''}
function toggleDropdown(){document.querySelectorAll('.profile-dropdown').forEach(d=>d.classList.toggle('show'))}
function closeDropdown(){document.querySelectorAll('.profile-dropdown').forEach(d=>d.classList.remove('show'))}
function logout(){if(confirm('Logout?')){resetForm();location.reload()}}

$('mobile').addEventListener('input',e=>{const m=e.target.value.trim();if(m.length===10){$('step1').classList.add('hidden-page');$('step2').classList.remove('hidden-page');$('display-mobile').textContent=m}});

// FEED
// ============================================================
function setTab(tab){currentTab=tab;document.querySelectorAll('.type-tabs button').forEach(b=>b.className='inactive');const map={'ALL':'tab-all','LOAD':'tab-loads','TRUCK':'tab-trucks'};$(map[tab]).className='active';renderFeed()}
async function renderFeed(){
    const container=$('feed-container');
    try{
        const {data:loads}=await sb.from('active_loads').select('*').eq('status',1);
        feedItems=[...(loads||[]).map(l=>({type:'LOAD',title:l.material||'Cargo',company:l.company||'',rate:l.rate||0,pin:l.pickup_pin||'',id:l.id}))];
        if(feedItems.length===0)container.innerHTML='<div style="text-align:center;padding:30px 0;color:#94a3b8;font-size:13px">No records found</div>';
        else container.innerHTML=feedItems.map(i=>`<div style="border:1px solid #e2e8f0;border-radius:10px;padding:8px 12px;margin-bottom:6px;cursor:pointer"><div style="font-weight:700;font-size:14px;color:#0f172a">${i.title}</div><div style="font-size:10px;color:#475569">${i.company}</div></div>`).join('');
    }catch(e){container.innerHTML='<div style="text-align:center;color:#ef4444">Error loading data</div>'}
}

// PROFILE
// ============================================================
async function loadProfile(){
    if(!currentUser)return;
    $('profile-mobile').textContent=currentUser.mobile||'--';
}
async function saveLoadGiverProfile(){const c=$('lg-company').value.trim();if(!c)return showToast('⚠️ Enter company');await sb.from('active_users').update({company_name:c}).eq('mobile',currentUser.mobile);currentUser.company_name=c;showToast('✅ Saved!');loadProfile()}
async function saveFleetProfile(){const c=$('fo-company').value.trim();if(!c)return showToast('⚠️ Enter company');await sb.from('active_users').update({fleet_company:c}).eq('mobile',currentUser.mobile);currentUser.fleet_company=c;showToast('✅ Saved!');loadProfile()}
</script>
