<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Test</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,sans-serif; }
        body {
            background: #2563eb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .box {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 48px; margin-bottom: 10px; }
        h2 { color: #1e293b; font-size: 24px; }
        p { color: #64748b; margin: 12px 0 24px; }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            background: #2563eb;
            color: white;
            margin: 6px 0;
        }
        .btn:hover { opacity: 0.8; }
        .btn-green { background: #16a34a; }
        .btn-red { background: #dc2626; }
        #status {
            background: #f8fafc;
            border-radius: 12px;
            padding: 12px;
            margin: 12px 0;
            font-size: 14px;
        }
        .pass { color: #16a34a; }
        .fail { color: #dc2626; }
        .pending { color: #f59e0b; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🚛</h1>
        <h2>PWA Install Test</h2>
        <p>Testing if this app can be installed</p>

        <div id="status">
            <div id="sw-status">⏳ Checking Service Worker...</div>
            <div id="install-status">⏳ Checking install...</div>
        </div>

        <button class="btn" id="install-btn" onclick="installApp()" disabled>
            📲 Install App
        </button>

        <button class="btn btn-green" onclick="registerSW()">
            🔄 Register SW
        </button>

        <button class="btn btn-red" onclick="resetAll()">
            🗑️ Reset All
        </button>

        <div id="log" style="background:#0f172a;color:#e2e8f0;border-radius:8px;padding:12px;margin-top:12px;font-family:monospace;font-size:11px;text-align:left;max-height:100px;overflow-y:auto;"></div>
    </div>

    <script>
        let deferredPrompt = null;

        function log(msg) {
            const el = document.getElementById('log');
            el.innerHTML += new Date().toLocaleTimeString() + ' - ' + msg + '\n';
            el.scrollTop = el.scrollHeight;
            console.log(msg);
        }

        function updateStatus(id, status, msg) {
            const el = document.getElementById(id);
            if (!el) return;
            const icons = { pass: '✅', fail: '❌', pending: '⏳' };
            el.innerHTML = `${icons[status] || 'ℹ️'} ${msg || status}`;
            el.className = status;
        }

        function registerSW() {
            if ('serviceWorker' in navigator) {
                log('📦 Registering SW...');
                navigator.serviceWorker.register('/sw.js', { scope: '/' })
                    .then(() => {
                        log('✅ SW registered!');
                        updateStatus('sw-status', 'pass', 'SW Active');
                    })
                    .catch(err => {
                        log('❌ SW failed: ' + err.message);
                        updateStatus('sw-status', 'fail', 'SW Failed');
                    });
            }
        }

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(choice => {
                    if (choice.outcome === 'accepted') {
                        log('🎉 App installed!');
                        updateStatus('install-status', 'pass', 'INSTALLED!');
                    } else {
                        log('❌ User cancelled');
                    }
                    deferredPrompt = null;
                    document.getElementById('install-btn').disabled = true;
                });
            } else {
                log('⚠️ No install prompt');
                if (navigator.userAgent.match(/Android/i)) {
                    log('📱 Tap Chrome menu → "Install app"');
                } else {
                    log('📱 Use "Add to Home Screen" manually');
                }
            }
        }

        function resetAll() {
            if (confirm('Reset all data?')) {
                if ('caches' in window) {
                    caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
                }
                localStorage.clear();
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistration().then(reg => {
                        if (reg) reg.unregister();
                    });
                }
                log('🗑️ Reset complete, reloading...');
                setTimeout(() => window.location.reload(), 1500);
            }
        }

        // Listen for install prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            log('✅ Install prompt ready!');
            updateStatus('install-status', 'pass', 'Ready to install!');
            document.getElementById('install-btn').disabled = false;
        });

        window.addEventListener('appinstalled', () => {
            log('🎉 Installed successfully!');
            updateStatus('install-status', 'pass', 'INSTALLED!');
            document.getElementById('install-btn').disabled = true;
        });

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            log('🚀 PWA Test started');
            log('📍 ' + window.location.href);
            registerSW();
            
            // Check if already installed
            if (window.matchMedia('(display-mode: standalone)').matches) {
                log('✅ Already installed!');
                updateStatus('install-status', 'pass', 'ALREADY INSTALLED!');
                document.getElementById('install-btn').disabled = true;
            }

            // Check manifest
            fetch('/manifest.json')
                .then(r => r.json())
                .then(d => {
                    log('✅ Manifest loaded: ' + d.name);
                })
                .catch(e => {
                    log('❌ Manifest error: ' + e.message);
                });
        });
    </script>
</body>
</html>
